<title>Acta de Acuerdos Mundo Fiesta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style id="st">
/* Layout: una columna de 820px; cada decisión es una fila-tarjeta con opciones, acuerdo, responsable y fecha. Barra inferior fija para guardar.
   Paleta neutra del volumen 2; verde solo para "acordada", naranja solo para el acento. */
:root{
  --bg:#F3F4F5; --surface:#FFFFFF; --ink:#1B1E22; --muted:#6A7078; --line:#E3E5E8; --soft:#EFF0F2;
  --solid:#262A2F; --on-solid:#FFFFFF; --acc:#E8590C; --ok:#0B9A6D; --ok-soft:#E6F6F0; --warn:#B7791F;
  --f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121417; --surface:#1A1D21; --ink:#ECEEF0; --muted:#9BA1A8; --line:#2A2F35; --soft:#22262B;
  --solid:#33393F; --on-solid:#F1F3F5; --acc:#FF8A4C; --ok:#38D9A9; --ok-soft:#173029; --warn:#F2C46B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1A1D21; --ink:#ECEEF0; --muted:#9BA1A8; --line:#2A2F35; --soft:#22262B;
  --solid:#33393F; --on-solid:#F1F3F5; --acc:#FF8A4C; --ok:#38D9A9; --ok-soft:#173029; --warn:#F2C46B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 120px;display:grid;gap:16px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(30px,5vw,44px);font-weight:800;letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
h1 span{color:var(--acc)}
h2{font-size:20px;font-weight:800;letter-spacing:-.01em}
.k{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border-radius:20px;padding:20px;display:grid;gap:14px;min-width:0}
.meta{display:grid;grid-template-columns:180px minmax(0,1fr);gap:12px}
.fld{display:grid;gap:5px;min-width:0}
.fld > span{font-size:12px;font-weight:600;color:var(--muted)}
input[type=text],input[type=date],textarea{font:inherit;color:var(--ink);background:var(--soft);border:1px solid transparent;border-radius:10px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:44px}
input:focus,textarea:focus{outline:none;border-color:var(--acc);background:var(--surface)}
.sum{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sum b{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
.pbar{flex:1;min-width:140px;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.dec{background:var(--surface);border-radius:20px;padding:18px 20px;display:grid;gap:12px;border:2px solid transparent}
.dec.done{border-color:var(--ok)}
.dh{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:start}
.dn{width:34px;height:34px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-weight:800}
.dec.done .dn{background:var(--ok);color:#fff}
.dh h3{font-size:16.5px;font-weight:700}
.dh p{font-size:13px;color:var(--muted);margin-top:2px}
.st{font:inherit;font-size:12.5px;font-weight:700;border-radius:999px;padding:6px 12px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.dec.done .st{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font:inherit;font-size:13.5px;font-weight:600;border-radius:999px;padding:7px 13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.opt[aria-pressed="true"]{background:var(--solid);color:var(--on-solid);border-color:transparent}
.opt small{font-weight:500;opacity:.75}
.row3{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 150px;gap:10px}
.qs{display:grid;gap:10px}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .in{max-width:820px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.msg{flex:1;min-width:160px;font-size:13.5px;color:var(--muted)}
.msg.dirty{color:var(--warn);font-weight:600}
.btn{font:inherit;font-weight:700;font-size:14px;border-radius:999px;padding:10px 18px;border:0;cursor:pointer}
.btn.pri{background:var(--acc);color:#fff}
.btn.pri:disabled{opacity:.45;cursor:default}
.btn.sec{background:var(--soft);color:var(--ink)}
.banner{background:var(--soft);border-radius:14px;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
@media (max-width:640px){.meta,.row3{grid-template-columns:minmax(0,1fr)}.dh{grid-template-columns:34px minmax(0,1fr)}.dh .st{grid-column:2;justify-self:start}}
</style>

<div id="app"></div>

<script type="application/json" id="state">{"meta":{"fecha":"","lugar":"","asistentes":"Daniela · David · Asesor"},"d":[{"t":"Serpentinas como prioridad única","h":"Una sola prioridad, revisión cada 30 días","opts":["Sí","Ajustar"],"sel":"","ok":false,"acuerdo":"","resp":"Gerencia","fecha":""},{"t":"Fecha de inicio","h":"Recomendado: A","opts":["A · Entrevistas ya, medición en enero","B · Todo desde ya"],"sel":"","ok":false,"acuerdo":"","resp":"Daniela y asesor","fecha":""},{"t":"Horas semanales de Daniela","h":"Como líder del proyecto","opts":[],"sel":"","ok":false,"acuerdo":"","resp":"Daniela","fecha":""},{"t":"Papel de David","h":"Ventas, entregas y compras de papel","opts":[],"sel":"","ok":false,"acuerdo":"","resp":"David","fecha":""},{"t":"Autorización para filmar","h":"Con consentimiento escrito de los operarios (Ley 1581 de 2012)","opts":["Autorizado","Con condiciones","No"],"sel":"","ok":false,"acuerdo":"","resp":"Gerencia","fecha":""},{"t":"Anuncio del plan al personal","h":"Cómo y cuándo","opts":[],"sel":"","ok":false,"acuerdo":"","resp":"Daniela","fecha":""},{"t":"Grupos GAME y premios","h":"Integrantes iniciales; premios como experiencias familiares","opts":[],"sel":"","ok":false,"acuerdo":"","resp":"Daniela","fecha":""},{"t":"Entrega del checklist de información","h":"Quién entrega cada bloque y cuándo","opts":[],"sel":"","ok":false,"acuerdo":"","resp":"Daniela y David","fecha":""},{"t":"Revisión a 30 días","h":"Fecha fija en el calendario","opts":[],"sel":"","ok":false,"acuerdo":"","resp":"Todos","fecha":""},{"t":"Ritmo de seguimiento","h":"Reunión corta de control","opts":["Semanal · 15 min","Quincenal"],"sel":"","ok":false,"acuerdo":"","resp":"Todos","fecha":""}],"q":[{"t":"¿Qué tendría que pasar en 90 días para que valga la pena?","a":""},{"t":"¿Qué clientes o pedidos de serpentinas presionan hoy?","a":""},{"t":"¿Qué se ha intentado antes en serpentinas y qué pasó?","a":""},{"t":"¿Cómo se registra hoy si una entrega salió completa?","a":""},{"t":"¿Hay algo del proceso o del personal que no se pueda tocar?","a":""},{"t":"¿Qué les preocupa del plan?","a":""},{"t":"¿Quién es la operaria más rápida y estaría dispuesta a enseñar?","a":""}],"notas":"","savedAt":0}</script>

<script id="app-js">
(function(){
  var SKEL='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>\n';
  var HEAD='<title>Acta de Acuerdos Mundo Fiesta</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">\n';
  var saved=JSON.parse(document.getElementById('state').textContent);
  var S=JSON.parse(JSON.stringify(saved));
  var DK='mf-acta-draft', dirty=false, readOnly=false, art=null;
  var app=document.getElementById('app');
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

  function render(){
    var n=S.d.filter(function(x){return x.ok}).length;
    var h='<header style="display:grid;gap:10px;padding-top:8px"><span class="k">Reunión de exposición · Plan de acción y propuesta</span><h1>Acta de <span>acuerdos</span></h1></header>';
    h+='<div id="banner"></div>';
    h+='<section class="card"><div class="meta"><label class="fld"><span>Fecha</span><input type="date" id="m-fecha" value="'+esc(S.meta.fecha)+'"></label><label class="fld"><span>Lugar</span><input type="text" id="m-lugar" value="'+esc(S.meta.lugar)+'" placeholder="Planta, sector Estadio"></label></div><label class="fld"><span>Asistentes</span><input type="text" id="m-asis" value="'+esc(S.meta.asistentes)+'"></label></section>';
    h+='<section class="card"><div class="sum"><div><span class="k">Decisiones acordadas</span><br><b id="cnt">'+n+' / '+S.d.length+'</b></div><div class="pbar"><i id="pb" style="width:'+(n/S.d.length*100)+'%"></i></div></div></section>';
    h+='<h2 style="margin-top:8px">Decisiones</h2>';
    S.d.forEach(function(d,i){
      h+='<article class="dec'+(d.ok?' done':'')+'" id="dec'+i+'"><div class="dh"><span class="dn">'+(i+1)+'</span><div><h3>'+esc(d.t)+'</h3><p>'+esc(d.h)+'</p></div><button type="button" class="st" data-i="'+i+'" aria-pressed="'+d.ok+'">'+(d.ok?'✓ Acordada':'Pendiente')+'</button></div>';
      if(d.opts.length){h+='<div class="opts" role="group" aria-label="Opciones">';d.opts.forEach(function(o){h+='<button type="button" class="opt" data-i="'+i+'" data-o="'+esc(o)+'" aria-pressed="'+(d.sel===o)+'">'+esc(o)+'</button>'});h+='</div>'}
      h+='<div class="row3"><label class="fld"><span>Acuerdo</span><textarea id="a'+i+'" data-i="'+i+'" data-f="acuerdo" rows="1" placeholder="Qué se decidió">'+esc(d.acuerdo)+'</textarea></label><label class="fld"><span>Responsable</span><input type="text" id="r'+i+'" data-i="'+i+'" data-f="resp" value="'+esc(d.resp)+'"></label><label class="fld"><span>Fecha</span><input type="date" id="f'+i+'" data-i="'+i+'" data-f="fecha" value="'+esc(d.fecha)+'"></label></div></article>';
    });
    h+='<h2 style="margin-top:8px">Respuestas de la gerencia</h2><section class="card qs">';
    S.q.forEach(function(q,i){h+='<label class="fld"><span>'+esc(q.t)+'</span><textarea id="q'+i+'" data-q="'+i+'" rows="2">'+esc(q.a)+'</textarea></label>'});
    h+='</section><h2 style="margin-top:8px">Otras notas y compromisos</h2><section class="card"><textarea id="notas" rows="4" placeholder="Cualquier otro acuerdo, duda o tarea">'+esc(S.notas)+'</textarea></section>';
    h+='<p class="k" style="text-transform:none;letter-spacing:0;font-weight:500">'+(S.savedAt?'Última versión guardada: '+new Date(S.savedAt).toLocaleString('es-CO'):'Aún no se ha guardado ninguna versión.')+'</p>';
    h+='<div class="bar"><div class="in"><span class="msg" id="msg">Sin cambios</span><button type="button" class="btn sec" id="copy">Copiar como texto</button><button type="button" class="btn pri" id="save" disabled>Guardar acta</button></div></div>';
    app.innerHTML='<div class="wrap">'+h+'</div>';
  }

  function refreshCount(){var n=S.d.filter(function(x){return x.ok}).length;document.getElementById('cnt').textContent=n+' / '+S.d.length;document.getElementById('pb').style.width=(n/S.d.length*100)+'%'}
  function setDirty(v){dirty=v;var m=document.getElementById('msg'),b=document.getElementById('save');
    if(readOnly){m.textContent='Vista de solo lectura: puede copiar el texto, pero no guardar.';m.className='msg';b.disabled=true;return}
    m.textContent=v?'Cambios sin guardar':'Sin cambios';m.className='msg'+(v?' dirty':'');b.disabled=!v;
    try{if(v)localStorage.setItem(DK,JSON.stringify({base:saved.savedAt,s:S}));else localStorage.removeItem(DK)}catch(e){}}

  app.addEventListener('input',function(e){var t=e.target;
    if(t.id==='m-fecha')S.meta.fecha=t.value;else if(t.id==='m-lugar')S.meta.lugar=t.value;else if(t.id==='m-asis')S.meta.asistentes=t.value;
    else if(t.dataset.f)S.d[+t.dataset.i][t.dataset.f]=t.value;else if(t.dataset.q!=null)S.q[+t.dataset.q].a=t.value;else if(t.id==='notas')S.notas=t.value;else return;
    setDirty(true)});
  app.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;
    if(t.classList.contains('st')){var d=S.d[+t.dataset.i];d.ok=!d.ok;var c=document.getElementById('dec'+t.dataset.i);c.classList.toggle('done',d.ok);t.textContent=d.ok?'✓ Acordada':'Pendiente';t.setAttribute('aria-pressed',d.ok);refreshCount();setDirty(true)}
    else if(t.classList.contains('opt')){var d2=S.d[+t.dataset.i];d2.sel=d2.sel===t.dataset.o?'':t.dataset.o;[].forEach.call(t.parentNode.children,function(b){b.setAttribute('aria-pressed',b.dataset.o===d2.sel)});setDirty(true)}
    else if(t.id==='save')save();
    else if(t.id==='copy')copy(t);
    else if(t.id==='recover')recover();
    else if(t.id==='discard'){try{localStorage.removeItem(DK)}catch(e){}document.getElementById('banner').innerHTML=''}});

  function toText(){var L=['ACTA DE ACUERDOS · MUNDO FIESTA','Fecha: '+(S.meta.fecha||'—')+' · Lugar: '+(S.meta.lugar||'—'),'Asistentes: '+(S.meta.asistentes||'—'),'','DECISIONES'];
    S.d.forEach(function(d,i){L.push((i+1)+'. '+d.t+' ['+(d.ok?'Acordada':'Pendiente')+']'+(d.sel?' · '+d.sel:''));if(d.acuerdo)L.push('   Acuerdo: '+d.acuerdo);L.push('   Responsable: '+(d.resp||'—')+(d.fecha?' · Fecha: '+d.fecha:''))});
    L.push('','RESPUESTAS DE LA GERENCIA');S.q.forEach(function(q){if(q.a)L.push('- '+q.t+' '+q.a)});
    if(S.notas){L.push('','NOTAS',S.notas)}return L.join('\n')}
  function copy(btn){var txt=toText(),done=function(){btn.textContent='Copiado';setTimeout(function(){btn.textContent='Copiar como texto'},1800)};
    try{navigator.clipboard.writeText(txt).then(done,function(){fallback(txt);done()})}catch(e){fallback(txt);done()}}
  function fallback(txt){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove()}

  function buildDoc(state){
    var json=JSON.stringify(state).replace(/</g,'\\u003c');
    return SKEL+HEAD+'<style id="st">'+document.getElementById('st').textContent+'</style>\n\n<div id="app"></div>\n\n<script type="application/json" id="state">'+json+'<\/script>\n\n<script id="app-js">'+document.getElementById('app-js').textContent+'<\/script>\n</body></html>';
  }
  function save(){
    if(!art){setMsg('Guardar no está disponible en esta vista. Use "Copiar como texto".');return}
    var b=document.getElementById('save');b.disabled=true;setMsg('Guardando…');
    var next=JSON.parse(JSON.stringify(S));next.savedAt=Date.now();
    try{localStorage.setItem(DK,JSON.stringify({base:saved.savedAt,s:S}))}catch(e){}
    art.publish(buildDoc(next)).then(function(){try{localStorage.removeItem(DK)}catch(e){}setMsg('Guardado')},function(err){
      var c=err&&err.code;
      if(c==='conflict'){setMsg('Alguien guardó antes; la página se recarga con esa versión. Sus cambios quedan para recuperar.')}
      else if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='consent_required'){readOnly=true;setDirty(dirty)}
      else if(c==='rate_limited'){setMsg('Demasiados guardados seguidos. Espere un momento y vuelva a intentar.');b.disabled=false}
      else{setMsg('No se pudo guardar. Intente de nuevo en unos segundos.');b.disabled=false}
    });
  }
  function setMsg(t){var m=document.getElementById('msg');m.textContent=t;m.className='msg'}
  function recover(){try{var dr=JSON.parse(localStorage.getItem(DK));if(dr&&dr.s){S=dr.s;render();setDirty(true)}}catch(e){}}

  render();
  // ¿Quedaron cambios sin guardar en este navegador?
  try{var dr=JSON.parse(localStorage.getItem(DK)||'null');
    if(dr&&dr.s){
      if(JSON.stringify(dr.s)!==JSON.stringify(saved)) document.getElementById('banner').innerHTML='<div class="banner">Hay cambios sin guardar de una sesión anterior en este navegador.<button type="button" class="btn sec" id="recover">Recuperar</button><button type="button" class="btn sec" id="discard">Descartar</button></div>';
      else localStorage.removeItem(DK);}
  }catch(e){}
  if(window.claude&&window.claude.use){window.claude.use('artifact').then(function(a){art=a;if(!a){readOnly=false}},function(){})}
})();
</script>
