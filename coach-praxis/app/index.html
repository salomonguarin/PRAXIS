const $=s=>document.querySelector(s);
let lOpen=null, ucOpen=0, mOpen=null, repW=null;
let S=load(), view='hoy', cur=1, sess=null, confirmReset=false, msg='', tick=null;
function load(){ try{const r=JSON.parse(localStorage.getItem(KEY)); if(r&&r.schema===SCHEMA) return r;}catch(e){} return {schema:SCHEMA,start:null,days:{},wait:[],targets:{blocks:null,mej:null},proj:{1:1,2:1,3:1,4:1}}; }
function migrate(){ for(const n in S.days){ const d=S.days[n]; if(d.p1&&!d.m1) d.m1=d.p1; if(d.p2&&!d.m4) d.m4=d.p2+(d.p3?'\nResultado esperado: '+d.p3:''); } if(!S.fab) S.fab={tested:false,note:''}; if(!S.sug) S.sug=[]; }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} schedSync(); }
function ymd(d){ const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4); return z.toISOString().slice(0,10); }
function dayNum(){ if(!S.start) return 0; return Math.round((new Date(ymd(new Date())+'T00:00')-new Date(S.start+'T00:00'))/864e5)+1; }
function dd(n){ if(!S.days[n]) S.days[n]={b:[false,false,false]}; if(!S.days[n].b) S.days[n].b=[false,false,false]; return S.days[n]; }
function lvl(n){ const d=S.days[n]; return d&&d.b?d.b.filter(Boolean).length:0; }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(t){ const e=$('#toast'); e.textContent=t; e.hidden=false; clearTimeout(e._t); e._t=setTimeout(()=>e.hidden=true,2200); }
function weekMetrics(w){ let done=0,prom=0,mej=0; const t=dayNum(); for(let n=(w-1)*7+1;n<=w*7;n++){ if(n>t) break; prom+=3; const d=S.days[n]; if(d){done+=lvl(n); mej+=(d.kzDone?1:0)+(d.uncDone?1:0);} } return {done,prom,pct:prom?Math.round(done/prom*100):null,mej,complete:w*7<=t}; }
function weekPass(w){ const m=weekMetrics(w),T=S.targets; if(!m.complete||T.blocks==null||T.mej==null) return null; return m.pct>=T.blocks&&m.mej>=T.mej&&(S.projNow??1)<=1; }
function streak(){ let s=0; const t=Math.min(dayNum(),28); for(let n=t;n>=1;n--){ if(lvl(n)===3) s++; else if(n===t) continue; else break; } return s; }

function render(){
 clearInterval(tick);
 const nav=[['hoy','Hoy'],['emp','Empresa'],['met','Método'],['prog','Progreso'],['aj','Ajustes']];
 $('#nav').innerHTML=nav.map(([k,l])=>`<button class="${(view===k||(k==='prog'&&view==='plan'))&&!sess?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 $('#nav').hidden=!!sess; $('#sgb').classList.toggle('low',!!sess);
 $('#app').innerHTML = sess ? vSess() : {hoy:vHoy,emp:vEmp,plan:vPlan,met:vMet,prog:vProg,aj:vAj}[view]();
 if(sess && $('#tm')) { upTimer(); tick=setInterval(upTimer,1000); }
 updateMic();
}
function go(v){ view=v; sess=null; msg=''; confirmReset=false; if(v==='hoy') cur=Math.min(Math.max(dayNum(),1),28); render(); scrollTo(0,0); }
function startNow(){ S.start=ymd(new Date()); cur=1; save(); render(); }

function ring(k){ const r=36,c=2*Math.PI*r; return `<svg class="ring" viewBox="0 0 84 84" role="img" aria-label="${k} de 3 sesiones"><circle class="bgc" cx="42" cy="42" r="${r}"/><circle class="fgc" cx="42" cy="42" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-k/3)}" transform="rotate(-90 42 42)"/><text x="42" y="50" text-anchor="middle">${k}/3</text></svg>`; }

function vHoy(){
 const n=cur, d=dd(n), q=QUOTES[(n-1)%QUOTES.length], today=dayNum(), ss=sessions(n);
 const startCard = !S.start ? `<div class="card stack"><h3>Empieza tu Fase 1</h3><div class="mut">28 días. Cada mañana: 3 sesiones guiadas. La app te dice qué hacer, paso a paso.</div><button class="btn" onclick="startNow()">Empezar hoy</button></div>` : '';
 const tiles=ss.map((s,i)=>{const done=d.b[i]; return `<button class="tile ${done?'done':''}" onclick="openS(${i})"><span class="num">${done?'✓':i+1}</span><span class="tx"><h3>${s.name}</h3><span class="mut">${s.time} · ${esc(s.desc)}</span></span><span class="go" aria-hidden="true">›</span></button>`}).join('');
 const wl=S.wait.map((w,i)=>{const left=30-Math.floor((Date.now()-w.t)/864e5);return `<div class="hero"><span>${esc(w.x)}</span><span class="mut">${left>0?left+' días':'lista para evaluar'} <button class="btn2" style="padding:4px 10px" aria-label="Quitar" onclick="delWait(${i})">×</button></span></div>`}).join('');
 return `<div class="stack">
 <div class="hero"><div><div class="eyebrow">Semana ${Math.ceil(n/7)} · ${TOOLS[Math.ceil(n/7)-1]}</div><h1>Día ${n}${n===today?'':''}</h1><div class="mut">${n===today?'Hoy':S.start?'Viendo otro día':'Vista previa'}</div><button class="pill rk" onclick="go('emp')">${RANKS[rankIdx(company())][0]} · ${xp()} XP</button></div>${ring(lvl(n))}</div>
 ${startCard}
 <div class="quote">${esc(q[0])}<div class="mut" style="font-style:normal">${esc(q[1])}</div></div>
 ${tiles}
 ${caseCard(n)}
 ${retoCard(n)}
 ${d.b[2]?repCard('Reporte del día '+n,dayLines(n),`dailyReport(${n},'claude')`,`dailyReport(${n},'papa')`,'rd'):''}
 ${d.b[2]?coachDayBox(n):''}
 ${d.b[2]&&n%7===0?repCard('Reporte de la semana '+n/7,weekLines(n/7),`weeklyReport(${n/7},'claude')`,`weeklyReport(${n/7},'papa')`,'rw'):''}
 <div class="actions" style="justify-content:space-between"><button class="btn2" onclick="step(-1)">‹ Día anterior</button><button class="btn2" onclick="step(1)">Día siguiente ›</button></div>
 <div class="card stack"><h3>¿Idea nueva?</h3><div class="mut">Anótala aquí y vuelve a tu Una Cosa. Se evalúa en 30 días.</div><input type="text" id="wi" placeholder="Escribe la idea" aria-label="Idea nueva"><button class="btn2" onclick="addWait()">Guardar en lista de espera</button>${wl}</div>
 </div>`;
}
function step(k){ cur=Math.min(28,Math.max(1,cur+k)); render(); }
function openS(i){ sess={k:i,s:0}; render(); scrollTo(0,0); }
function addWait(){ const v=$('#wi').value.trim(); if(!v) return; S.wait.push({x:v,t:Date.now()}); save(); toast('Guardada. Vuelve a tu Una Cosa.'); render(); }
function delWait(i){ S.wait.splice(i,1); save(); render(); }

function field(n,[k,l,type]){
 const d=dd(n), id='f-'+k;
 if(type==='suggest') return `<button class="lbtn sug" onclick="useSug(${n})">Usar la propuesta: ${esc(l)}</button>`;
 if(type==='onething') return oneThing(n,k,false);
 if(type==='onething-open') return `<div><div class="fl">${l}</div>${oneThing(n,k,true)}</div>`;
 if(type==='scale') return `<div><div class="fl">${l}</div><div class="scale">${[1,2,3,4,5].map(v=>`<button class="${d[k]===v?'on':''}" aria-label="${l}: ${v}" onclick="setA(${n},'${k}',${v},1)">${v}</button>`).join('')}</div><div class="hero mut" style="font-size:14px;padding:0"><span>Muy bajo</span><span>Muy alto</span></div></div>`;
 if(type==='chips'){ const a=d[k]||[]; return `<div><div class="fl">${l}</div><div class="chips">${WASTES.map((w,i)=>`<button class="${a.includes(w)?'on':''}" onclick="togChip(${n},'${k}',${i})">${w}</button>`).join('')}</div></div>`; }
 if(type==='check'||type==='yes') return `<label class="chk" for="${id}"><input type="checkbox" id="${id}" ${d[k]?'checked':''} onchange="setA(${n},'${k}',this.checked,1)"><span>${l}</span></label>`;
 if(type==='area') return `<div><div class="flrow"><label class="fl" for="${id}">${l}</label>${micBtn(id,n,k)}</div><textarea id="${id}" oninput="setA(${n},'${k}',this.value)">${esc(d[k])}</textarea></div>`;
 return `<div><div class="flrow"><label class="fl" for="${id}">${l}</label>${type==='num'?'':micBtn(id,n,k)}</div><input type="${type==='num'?'number':'text'}" inputmode="${type==='num'?'numeric':'text'}" id="${id}" value="${esc(d[k])}" oninput="setA(${n},'${k}',${type==='num'?'this.value===\'\'?\'\':+this.value':'this.value'})"></div>`;
}
function useSug(n){ setA(n,'main','Completar el entrenamiento de hoy: '+DAYS[n-1].t,1); toast('Una Cosa definida'); }
function setA(n,k,v,re){ dd(n)[k]=v; save(); if(re) render(); }
function togChip(n,k,i){ const d=dd(n), w=WASTES[i]; d[k]=d[k]||[]; d[k]=d[k].includes(w)?d[k].filter(x=>x!==w):d[k].concat(w); save(); render(); }

function statsBox(n){ const m=weekMetrics(Math.ceil(n/7)); return `<div class="card stats"><div><div class="k">${m.pct==null?'–':m.pct+'%'}</div><div class="mut">Sesiones cumplidas</div></div><div><div class="k">${m.mej}</div><div class="mut">Mejoras y acciones incómodas</div></div><div><div class="k">${streak()}</div><div class="mut">Días seguidos al 100%</div></div></div>`; }

function learnCard(key){ const L=LEARN[key]; if(!L) return ''; return `<div class="learn stack"><div class="eyebrow">${esc(L.src)} · 1 minuto</div><h3>${esc(L.t)}</h3><div>${esc(L.que)}</div><div class="ex2"><b>En una fábrica: </b>${esc(L.fab)}</div><div class="ex2"><b>En tu vida: </b>${esc(L.vida)}</div><div class="kq">${esc(L.q)}</div></div>`; }
function exBtn(n){ const E=EXM[EXD[n-1]]; if(!E) return ''; const o=lOpen==='ex', J=E.j, row=(l,v)=>`<div class="ex2"><b>${l}: </b>${esc(v)}</div>`; return `<button class="lbtn" aria-expanded="${o}" onclick="lOpen=lOpen==='ex'?null:'ex';render()">${o?'Ocultar ejemplos':'Ver ejemplos: historia y reto'}</button>${o?`<div class="learn stack"><div class="eyebrow">Historia</div><div>${esc(E.h)}</div><div class="eyebrow" style="border-top:1px solid var(--line);padding-top:12px">Reto en la Fábrica · 10 a 15 min</div><h3>${esc(J.t)}</h3>${row('Equipos',J.m)}${row('Roles',J.o)}${row('Ronda 1',J.r1)}${row('Mejora',J.mj)}${row('Ronda 2',J.r2)}${row('Reto final',J.fin)}<div class="kq">Descubren: ${esc(J.d)}</div>${row('Cierre con empresarios',J.e)}${row('Cierre con operarios y estudiantes',J.op)}<div class="mut">Reto original de Praxis con equipos de la Fábrica. Úsalo de inspiración; tu propia versión vale más.</div></div>`:''}`; }
function learnBtn(key){ const L=LEARN[key]; if(!L) return ''; const open=lOpen===key; return `<button class="lbtn" aria-expanded="${open}" onclick="lOpen=lOpen==='${key}'?null:'${key}';render()">${open?'Ocultar':'¿Qué es '+esc(L.t)+'?'} <span class="mut">(1 min)</span></button>${open?learnCard(key):''}`; }
function oneThing(n,k,open){
 const d=dd(n), p=k+'_o';
 if(!open && !ucOpen) return `<button class="btn2" onclick="ucOpen=1;render()">Ayúdame a definirla</button>`;
 const rows=[0,1,2,3,4].map(i=>{const v=d[p+i]||'', y=d[p+'y'+i], im=d[p+'i'+i]; return `<div class="opt stack"><input type="text" id="${p}${i}" aria-label="Opción ${i+1}" placeholder="Opción ${i+1}" value="${esc(v)}" oninput="setA(${n},'${p}${i}',this.value)"><div class="mut">¿Si la hago, lo demás se vuelve más fácil o innecesario?</div><div class="scale">${[['Sí',true],['No',false]].map(([l,b])=>`<button class="${y===b?'on':''}" onclick="setA(${n},'${p}y${i}',${b},1)">${l}</button>`).join('')}</div><div class="mut">Impacto en tu vida y en Praxis</div><div class="scale">${[1,2,3,4,5].map(x=>`<button class="${im===x?'on':''}" onclick="setA(${n},'${p}i${i}',${x},1)">${x}</button>`).join('')}</div></div>`}).join('');
 const opts=[0,1,2,3,4].filter(i=>d[p+i]&&d[p+'y'+i]!==undefined&&d[p+'i'+i]).map(i=>({i,t:d[p+i],s:(d[p+'y'+i]?10:0)+d[p+'i'+i]})).sort((a,b)=>b.s-a.s);
 const best=opts[0];
 return `<div class="card stack"><h3>Encuentra tu Una Cosa</h3><div class="mut">Escribe hasta 5 opciones y evalúa cada una. La app ordena y te sugiere la más fuerte.</div>${rows}
 ${best?`<div class="learn stack"><div class="eyebrow">Sugerencia</div><h3>${esc(best.t)}</h3><button class="btn" onclick="setA(${n},'${k}',dd(${n})['${p}${best.i}'],1);toast('Una Cosa definida')">Elegir esta</button></div>`:''}
 ${d[k]&&k!=='main'?`<div class="kq">Elegida: ${esc(d[k])}</div>`:''}</div>`;
}

function vSess(){
 const n=cur, S0=sessions(n)[sess.k], st=S0.steps[sess.s], last=sess.s===S0.steps.length-1;
 return `<div class="stack">
 <div class="hero"><button class="btn2" onclick="sess=null;render()">‹ Hoy</button><span class="mut">Día ${n} · ${S0.name}</span></div>
 <div class="dots" aria-label="Paso ${sess.s+1} de ${S0.steps.length}">${S0.steps.map((_,i)=>`<i class="${i<=sess.s?'on':''}"></i>`).join('')}</div>
 <div class="eyebrow">Paso ${sess.s+1} de ${S0.steps.length}${st.min?' · '+st.min+' min':''}${st.src?' · '+esc(st.src):''}</div>
 <h2>${esc(st.t)}</h2>
 ${st.learnOpen?learnCard(st.learnOpen):''}
 <ol class="do">${st.do.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
 ${st.learn?learnBtn(st.learn):''}
 ${st.praxis?exBtn(n):''}
 ${st.min&&!st.learnOpen?timerBox(n,'tm'+sess.k+'_'+sess.s,st.min):''}
 ${st.stats?statsBox(n):''}
 ${st.caso?caseBox(n):''}
 ${(st.f||[]).map(f=>field(n,f)).join('')}
 <div class="why"><b>Por qué: </b>${esc(st.why)}</div>
 <div class="actions">${sess.s>0?`<button class="btn2" onclick="go2(-1)">‹ Atrás</button>`:''}<button class="btn" onclick="${last?'finish()':'go2(1)'}">${last?'Terminar '+S0.name:'Siguiente'}</button></div>
 </div>`;
}
function go2(k){ sess.s+=k; lOpen=null; ucOpen=0; render(); scrollTo(0,0); }
function finish(){ const n=cur, d=dd(n), sessKdone=sess.k; d.b[sess.k]=true; save(); const name=sessions(n)[sess.k].name; sess=null; render(); const r=sessKdone===2&&$('#rd'); if(r) r.scrollIntoView(); else scrollTo(0,0); toast(r?'Cierre completada. Tu reporte está listo.':name+' completada'); }

function timerBox(n,key,min){ const ts=dd(n)[key]; return `<div class="card timerc"><div class="timer" id="tm" data-k="${key}" data-m="${min}">${min}:00</div><div class="mut" id="tms">${min} minutos para este ejercicio</div>${ts?`<button class="btn2" onclick="dd(${n})['${key}']=null;save();render()">Reiniciar</button>`:`<button class="btn" onclick="dd(${n})['${key}']=Date.now();save();render()">Iniciar ${min} min</button>`}</div>`; }
function upTimer(){ const e=$('#tm'); if(!e) return; const ts=dd(cur)[e.dataset.k], dur=e.dataset.m*60000; if(!ts) return; const left=Math.max(0,dur-(Date.now()-ts)); const m=Math.floor(left/60000), s=Math.floor(left%60000/1000); e.textContent=m+':'+String(s).padStart(2,'0'); $('#tms').textContent=left?'En curso: sigue los pasos.':'Tiempo cumplido. Completa tus respuestas y sigue.'; }

function vPlan(){
 const t=dayNum();
 return `<div class="stack"><h1>Plan</h1>${phases()}<div class="mut">Fase 1: 28 días, una herramienta por semana. Toca un día para abrirlo.</div>`+[0,1,2,3].map(w=>`<div class="card"><div class="eyebrow">Semana ${w+1}</div><h3 style="margin-bottom:6px">${TOOLS[w]}</h3>${[0,1,2,3,4,5,6].map(i=>{const n=w*7+i+1;return `<button class="dayrow ${n===t?'cur':''}" onclick="cur=${n};view='hoy';render();scrollTo(0,0)"><span class="n l${lvl(n)}">${n}</span><span>${esc(DAYS[n-1].t)}</span></button>`}).join('')}</div>`).join('')+`</div>`;
}

function energyChart(){
 const pts=[]; for(let n=1;n<=28;n++){ const v=S.days[n]&&S.days[n].en; if(v) pts.push([n,v]); }
 const X=n=>24+(n-1)*(256/27), Y=v=>100-(v-1)*20;
 const grid=[1,3,5].map(v=>`<line class="grid" x1="24" x2="280" y1="${Y(v)}" y2="${Y(v)}"/><text x="14" y="${Y(v)+4}" text-anchor="middle">${v}</text>`).join('');
 const xl=[1,7,14,21,28].map(n=>`<text x="${X(n)}" y="118" text-anchor="middle">${n}</text>`).join('');
 const line=pts.length>1?`<polyline class="ln" points="${pts.map(([n,v])=>X(n)+','+Y(v)).join(' ')}"/>`:'';
 return `<svg class="chart" viewBox="0 0 290 122" role="img" aria-label="Energía por día">${grid}${xl}${line}${pts.map(([n,v])=>`<circle class="pt" cx="${X(n)}" cy="${Y(v)}" r="3.5"/>`).join('')}</svg>${pts.length?'':'<div class="mut">Aparece cuando registres tu energía en la Apertura.</div>'}`;
}
function vProg(){
 const t=Math.min(dayNum(),28), all=[1,2,3,4].map(weekMetrics);
 const done=all.reduce((a,m)=>a+m.done,0), prom=all.reduce((a,m)=>a+m.prom,0), pct=prom?Math.round(done/prom*100):0, T=S.targets;
 const passes=[2,3,4].map(weekPass);
 const gate = T.blocks==null||T.mej==null ? ['nt','Fija tus metas en Ajustes al terminar la semana 1.'] : passes.includes(false) ? ['','No pasa: repite la Fase 1.'] : passes.every(p=>p===true) ? (S.fab&&S.fab.tested ? ['ok','Superada: pasa a Fase 2, Enseñar.'] : ['nt','Falta probar un reto del banco en la Fábrica (pestaña Método).']) : ['nt','En evaluación.'];
 const rows=[1,2,3,4].map(w=>{const m=all[w-1],p=weekPass(w);return `<tr><td>Semana ${w}</td><td>${m.pct==null?'–':m.pct+'%'}</td><td>${m.prom?m.mej:'–'}</td><td>${p==null?'<span class="pill nt">pendiente</span>':p?'<span class="pill ok">cumple</span>':'<span class="pill">no cumple</span>'}</td></tr>`}).join('');
 return `<div class="stack"><h1>Progreso</h1>
 <div class="card stats"><div><div class="k">${pct}%</div><div class="mut">Sesiones cumplidas</div></div><div><div class="k">${streak()}</div><div class="mut">Días seguidos al 100%</div></div><div><div class="k">${t}/28</div><div class="mut">Días</div></div></div>
 <div class="card stack"><h3>Tus 28 días</h3><div class="heat">${Array.from({length:28},(_,i)=>`<button class="l${lvl(i+1)} ${i+1===dayNum()?'cur':''}" aria-label="Día ${i+1}" onclick="cur=${i+1};view='hoy';render();scrollTo(0,0)">${i+1}</button>`).join('')}</div>
 <div class="legend"><span><i></i>0 sesiones</span><span><i style="background:var(--acs)"></i>1</span><span><i style="background:var(--warn)"></i>2</span><span><i style="background:var(--ok)"></i>3</span></div></div>
 <div class="card stack"><h3>Tu energía</h3>${energyChart()}</div>
 <div class="card stack"><h3>Indicadores por semana</h3><div class="tw"><table><tr><th></th><th>Sesiones</th><th>Mejoras</th><th>Estado</th></tr>${rows}</table></div><div class="mut">Metas: sesiones ${T.blocks==null?'sin fijar':'≥ '+T.blocks+'%'}, mejoras ${T.mej==null?'sin fijar':'≥ '+T.mej+' por semana'}, proyectos activos ≤ 1.</div></div>
 <div class="card stack"><h3>Puerta a Fase 2</h3><div class="pill ${gate[0]}" style="border-radius:12px;padding:10px 14px;font-size:16px">${gate[1]}</div><div class="mut">Regla: semanas 2, 3 y 4 seguidas cumpliendo, tu antes y después documentado y un reto del banco probado en la Fábrica.</div></div>
 <div class="card stack"><h3>Reporte semanal</h3><div class="mut">Para que Claude lo califique y tu papá lo revise. Elige la semana.</div><div class="scale">${[1,2,3,4].map(w=>`<button class="${repW===w?'on':''}" onclick="repW=${w};render()">${w}</button>`).join('')}</div></div>
 ${repW?repCard('Semana '+repW+' · '+TOOLS[repW-1],weekLines(repW),`weeklyReport(${repW},'claude')`,`weeklyReport(${repW},'papa')`,'rp'):''}
 ${phases()}<button class="btn2" onclick="go('plan')">Ver el plan de 28 días</button>
 <div class="card stack"><h3>Registro completo</h3><div class="mut">Todo lo que has escrito, día por día. Pégalo en Claude cuando quieras una revisión a fondo.</div><button class="btn2" onclick="copyCtx()">Copiar mi registro</button><textarea id="ctx" aria-label="Registro en texto" hidden></textarea></div>
 </div>`;
}
function dayBlock(n){ const d=S.days[n]; if(!d) return ''; const lines=[];
 sessions(n).forEach(s=>s.steps.forEach(st=>(st.f||[]).forEach(([k,l,ty])=>{ if(ty==='suggest'||ty==='onething') return; let v=d[k]; if(v===undefined||v===''||v===false||(Array.isArray(v)&&!v.length)) return; if(v===true) v='sí'; if(Array.isArray(v)) v=v.join(', '); lines.push(`- ${l}: ${v}`); })));
 if(!lines.length&&!lvl(n)) return '';
 return `\n## Día ${n} · ${DAYS[n-1].t} · sesiones ${lvl(n)}/3\n`+lines.join('\n')+'\n'; }
function context(){
 let out=`# Forja Praxis: registro de Salomon\nInicio: ${S.start||'sin iniciar'} · Día actual: ${Math.min(dayNum(),28)} de 28\n`;
 for(let n=1;n<=28;n++) out+=dayBlock(n);
 if(S.wait.length) out+=`\n## Lista de espera\n`+S.wait.map(w=>'- '+w.x).join('\n')+'\n';
 return out;
}
function copyCtx(){ const t=$('#ctx'), txt=context(); t.value=txt; navigator.clipboard.writeText(txt).then(()=>toast('Registro copiado'),()=>{t.hidden=false;t.select();toast('Selecciona y copia el texto');}); }

/* ---------- Reportes ---------- */
function v_(x,u){ return x===undefined||x===null||x===''?'sin dato':x+(u||''); }
function fpN(d){ return FP.filter(k=>d&&d[k]).length; }
function fichaN(d){ return MF.filter(([k])=>d&&d[k]&&String(d[k]).trim()).length; }
function dateOf(n){ if(!S.start) return ''; const t=new Date(S.start+'T00:00'); t.setDate(t.getDate()+n-1); return ymd(t); }
function dayLines(n){ const d=dd(n); return [
 `Sesiones ${lvl(n)}/3 · Una Cosa: ${v_(d.main)} · Cumplí mi palabra: ${v_(d.sc,'/5')}`,
 `Energía ${v_(d.en,'/5')} · Sueño ${v_(d.sl,' h')} · Interrupciones ${v_(d.int)}`,
 `Aprendí: ${v_(d.l1)} · Ficha del método: ${fichaN(d)}/${MN} · Filtro Praxis: ${fpN(d)}/4`,
 `Acción incómoda: ${d.uncDone?'hecha':'no hecha'}${d.unc?' · '+d.unc:''}`,
 `Mejora para mañana: ${v_(d.imp)}`]; }
function dailyReport(n,who){ const L=dayLines(n).map(x=>'- '+x).join('\n'), f=dateOf(n);
 if(who==='papa') return `Asunto: Reporte del día ${n} de 28 · Salomón\n\nPapá, este es mi reporte del día ${n} de 28${f?' ('+f+')':''}:\n${L}\n\n¿Qué ves que debo corregir?`;
 return `# Reporte diario · Día ${n} de 28${f?' · '+f:''} · ${DAYS[n-1].t}\n${L}\n\nCoach: califica de 1 a 5 cada eje: ${RUB}. Da el total sobre 25. Juzga con dureza lo que no cumplí y dime por qué importa. Señala un patrón si lo ves. Termina con un reto para mañana con hora exacta. No inventes datos: si falta uno, dilo y baja la nota de Evidencia.\n\n# Detalle del día`+(dayBlock(n)||'\nSin registros.'); }
function weekData(w){ const r={en:[],int:0,intN:0,waste:{},uncY:0,uncN:0,uncL:[],fichas:0,imp:[],ch:[],full:0,days:[]};
 for(let n=(w-1)*7+1;n<=w*7;n++){ const d=S.days[n]; if(!d) continue; r.days.push(n);
  if(d.en) r.en.push(d.en); if(d.int!==undefined&&d.int!==''){r.int+=+d.int;r.intN++;}
  (d.wl||[]).forEach(x=>r.waste[x]=(r.waste[x]||0)+1);
  if(d.uncDone){r.uncY++; if(d.unc) r.uncL.push('Día '+n+': '+d.unc);} else if(d.b&&d.b[2]) r.uncN++;
  if(fichaN(d)===MN) r.fichas++; if(d.imp) r.imp.push('Día '+n+': '+d.imp); if(d.ch) r.ch.push('Día '+n+': '+d.ch); if(lvl(n)===3) r.full++; }
 return r; }
function weekLines(w){ const m=weekMetrics(w), x=weekData(w), T=S.targets, p=weekPass(w);
 const avg=x.en.length?(x.en.reduce((a,b)=>a+b,0)/x.en.length).toFixed(1)+'/5':'sin dato';
 const tr=x.en.length>1?(x.en[x.en.length-1]>x.en[0]?'sube':x.en[x.en.length-1]<x.en[0]?'baja':'estable'):'sin dato';
 const top=Object.entries(x.waste).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>k+' ('+v+')').join(', ')||'sin registro';
 return [
 `Sesiones cumplidas: ${m.pct==null?'sin dato':m.pct+'%'} (meta ${T.blocks==null?'sin fijar':T.blocks+'%'}) · Días completos: ${x.full} de 7`,
 `Mejoras y acciones incómodas: ${m.mej} (meta ${T.mej==null?'sin fijar':T.mej})`,
 `Estado de la semana: ${p==null?'en evaluación':p?'cumple':'no cumple'}`,
 `Energía promedio: ${avg}, tendencia ${tr}`,
 `Interrupciones: ${x.int} en total${x.intN?', '+(x.int/x.intN).toFixed(1)+' por día':''}`,
 `Desperdicios más repetidos: ${top}`,
 `Acciones incómodas: ${x.uncY} hechas, ${x.uncN} evitadas`,
 `Banco del método: ${x.fichas} de 7 fichas completas (8 momentos)`]; }
function weeklyReport(w,who){ const L=weekLines(w).map(x=>'- '+x).join('\n'), x=weekData(w), li=a=>a.length?a.map(v=>'- '+v).join('\n'):'- sin registro';
 if(who==='papa') return `Asunto: Reporte de la semana ${w} de 4 · Salomón\n\nPapá, este es mi reporte de la semana ${w} de 4 (${TOOLS[w-1]}):\n${L}\n\nAcciones incómodas que hice:\n${li(x.uncL)}\n\n¿Qué me recomiendas corregir la próxima semana?`;

/* ---------- Método ---------- */
function cap(x){ return x.charAt(0).toUpperCase()+x.slice(1); }
function praxisIdx(n){ return sessions(n)[1].steps.findIndex(s=>s.praxis); }
function fichaCard(n){ const d=S.days[n]||{}; return `<div class="learn stack" style="margin:8px 0 12px"><div class="mut">Filtro Praxis: ${fpN(d)}/4${fpN(d)?' · '+FP.map((k,i)=>d[k]?PRIN[i]:'').filter(Boolean).join(' · '):''}</div>${MF.map(([k,l])=>`<div><div class="eyebrow">${l}</div><div style="white-space:pre-wrap">${d[k]&&String(d[k]).trim()?esc(d[k]):'<span class="mut">Pendiente</span>'}</div></div>`).join('')}<button class="btn2" onclick="cur=${n};sess={k:1,s:praxisIdx(${n})};render();scrollTo(0,0)">${fichaN(d)===MN?'Editar':'Completar'} en el día ${n}</button></div>`; }
function vMet(){
 const all=Array.from({length:28},(_,i)=>S.days[i+1]||{}), ok=all.filter(d=>fichaN(d)===MN).length, games=all.filter(d=>d.m4&&String(d.m4).trim()).length, F=S.fab;
 return `<div class="stack"><h1>Método</h1><div class="mut">Tu método Praxis, ficha por ficha. Cada ficha es un mini taller con los 8 momentos de la Fábrica: Conectar, Prestar atención, Imagen, Informar, Practicar, Extender, Refinar y Ejecutar.</div>
 <div class="card stack"><div class="eyebrow">Principios del método Praxis</div><ol class="do">${PRIN.map(x=>`<li>${x}</li>`).join('')}</ol><div class="mut">Cada reto pasa por este filtro antes de llegar a la Fábrica.</div></div>
 <div class="card stats"><div><div class="k">${ok}/28</div><div class="mut">Fichas completas</div></div><div><div class="k">${games}</div><div class="mut">Retos diseñados</div></div><div><div class="k">${F.tested?'Sí':'No'}</div><div class="mut">Reto probado en la Fábrica</div></div></div>
 ${[0,1,2,3].map(w=>`<div class="card"><div class="eyebrow">Semana ${w+1}</div><h3 style="margin-bottom:6px">${TOOLS[w]}</h3>${[0,1,2,3,4,5,6].map(i=>{const n=w*7+i+1,k=fichaN(all[n-1]),o=mOpen===n;return `<button class="dayrow" aria-expanded="${o}" onclick="mOpen=mOpen===${n}?null:${n};render()"><span class="n ${k===MN?'l3':k?'l1':''}">${k===MN?'✓':n}</span><span style="flex:1">${esc(cap(DAYS[n-1].praxis.c))}</span><span class="mut">${k}/${MN}</span></button>${o?fichaCard(n):''}`}).join('')}</div>`).join('')}
 <div class="card stack"><h3>Prueba en la Fábrica</h3><div class="mut">Antes de pasar a la Fase 2, lleva un reto del banco a la Fábrica y pruébalo con personas reales.</div><label class="chk" for="fbt"><input type="checkbox" id="fbt" ${F.tested?'checked':''} onchange="S.fab.tested=this.checked;save();render()"><span>Probé un reto en la Fábrica</span></label><div><label class="fl" for="fbn">Qué reto probé, con quién y qué pasó</label><textarea id="fbn" oninput="S.fab.note=this.value;save()">${esc(F.note)}</textarea></div></div>
 <div class="card stack"><h3>Tu método en un documento</h3><div class="mut">Cópialo para revisarlo con tu papá o pegarlo en Claude.</div><button class="btn" onclick="copyTxt('mdt',methodDoc())">Copiar mi método</button><textarea id="mdt" aria-label="Método en texto" hidden></textarea></div>
 </div>`;
}
function methodDoc(){ let o=`# Método Praxis · borrador\nPrincipios: ${PRIN.join(' · ')}.\nConstruido en la Fase 1 (Vivir). Fichas completas: ${Array.from({length:28},(_,i)=>fichaN(S.days[i+1])).filter(k=>k===MN).length} de 28.\n`;
 for(let n=1;n<=28;n++){ const d=S.days[n]; if(!fichaN(d)&&!fpN(d)) continue; o+=`\n## ${n}. ${cap(DAYS[n-1].praxis.c)}\n`+MF.map(([k,l])=>`- ${l}: ${d[k]&&String(d[k]).trim()?d[k]:'pendiente'}`).join('\n')+`\n- Filtro Praxis ${fpN(d)}/4: ${FP.map((k,i)=>d[k]?PRIN[i]:'').filter(Boolean).join(', ')||'sin marcar'}\n`; }
 if(S.fab.tested||S.fab.note) o+=`\n## Prueba en la Fábrica\n- Probado: ${S.fab.tested?'sí':'no'}\n- ${S.fab.note||'sin nota'}\n`;
 return o; }

function G(){ if(!S.g) S.g={dec:{},name:''}; if(!S.g.dec) S.g.dec={}; return S.g; }
function decN(){ return Object.keys(G().dec).length; }
function caseFor(n){ const d=dd(n); if(d.cs) return d.cs; const k=decN(); return k<CASES.length?k+1:null; }
function ordFor(ch){ const r=ch%3; return [0,1,2].map(i=>(i+r)%3); }
function company(){ const D=G().dec, ks=Object.keys(D).map(Number), k=ks.length; if(!k) return {k:0,q:0,v:0,e:1,t:0,p:0,m:0};
 const q=ks.reduce((s,c)=>s+CASES[c-1].o[D[c].o].g,0)/k, f=Math.max(0.05,q*q), B=BASE[Math.min(k,28)];
 return {k,q,v:Math.round(B[0]*f),e:Math.max(1,Math.round(B[1]*f)),t:B[2]?Math.max(1,Math.round(B[2]*f)):0,p:Math.round(B[3]*f),m:Math.round(q*100)}; }
function rankIdx(s){ if(s.p>=5&&s.t>=50) return 6; if(s.p>=2) return 5; if(s.e>200) return 4; if(s.e>50) return 3; if(s.e>10) return 2; if(s.e>=2) return 1; return 0; }
function coName(){ return G().name||'Salomón Café'; }
function money(v){ return v>=1000?'COP '+(v/1000).toLocaleString('es-CO',{maximumFractionDigits:1})+' mil M':'COP '+v+' M'; }
function xp(){ let x=0; for(const n in S.days){ const d=S.days[n]; x+=lvl(n)*10; if(fichaN(d)===MN) x+=15; if(d.rsDone) x+=15; } const D=G().dec; for(const c in D) x+=20+Math.round(CASES[c-1].o[D[c].o].g*10); return x+streak()*5; }
function logros(){ const k=decN(), ds=Object.keys(S.days).map(Number), D=G().dec, full=ds.filter(n=>lvl(n)===3).length, fichas=ds.filter(n=>fichaN(S.days[n])===MN).length, rs=ds.filter(n=>S.days[n].rsDone).length, greats=Object.keys(D).filter(c=>CASES[c-1].o[D[c].o].g===1).length, r=rankIdx(company());
 return [['Primer paso','Un día completo al 100%',full>=1],['Racha de 3','3 días seguidos al 100%',streak()>=3],['Racha de 7','7 días seguidos al 100%',streak()>=7],['Primera tienda','Resuelve el capítulo 3',k>=3],['Fábrica propia','Llega a la tostadora',k>=8],['Estratega','5 grandes decisiones',greats>=5],['Maestro del método','5 fichas completas',fichas>=5],['Retador','5 retos sorpresa',rs>=5],['Multinacional','Rango Multinacional',r>=5],['Imperio','Rango Imperio',r>=6]]; }
function caseIdx(n){ return sessions(n)[1].steps.findIndex(s=>s.caso); }
function caseBox(n){
 const ch=caseFor(n); if(!ch) return `<div class="learn stack"><h3>Historia completa</h3><div>Resolviste los 28 capítulos. Mira tu empresa en la pestaña Empresa.</div></div>`;
 const C=CASES[ch-1], dec=G().dec[ch], d=dd(n), pv=G().dec[ch-1];
 let h=`<div class="case stack"><div class="eyebrow">Capítulo ${ch} de 28 · ${NIV[C.lv]}</div><h3>${esc(C.t)}</h3>${pv?`<div class="ex2"><b>Capítulo anterior: </b>${esc(CASES[ch-2].o[pv.o].r)}</div>`:''}<div>${esc(C.sit)}</div><ul class="rep">${C.dat.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="kq">${esc(C.q)}</div>`;
 if(!dec){ const sel=d.csel;
  h+=ordFor(ch).map((i,j)=>`<button class="opt2 ${sel===i?'on':''}" onclick="setA(${n},'csel',${i},1)"><b>${'ABC'[j]}</b> ${esc(C.o[i].t)}</button>`).join('')+field(n,['cwhy','¿Por qué? En 2 o 3 líneas','area'])+`<button class="btn" onclick="decide(${n},${ch})">Tomar la decisión</button></div>`;
  return h; }
 const o=C.o[dec.o], gr=GRADE[o.g];
 h+=`<div class="res stack"><span class="pill ${gr[1]}">${gr[0]}</span><div><b>Tu decisión: </b>${esc(o.t)}</div><div>${esc(o.r)}</div></div>
 <div class="ex2"><b>Lo que pasó en la vida real · ${esc(C.src)}: </b>${esc(C.real)}</div>
 <div class="kq">Lección: ${esc(C.lec)}</div>${C.learn?learnBtn(C.learn):''}
 ${coachCaseBox(ch)}</div>`;
 return h;
}
function decide(n,ch){ const d=dd(n); if(d.csel==null){ toast('Elige una opción'); return; } const w=(d.cwhy||'').trim(); if(w.length<10){ toast('Explica tu porqué en 2 o 3 líneas'); return; }
 const before=rankIdx(company()); G().dec[ch]={o:d.csel,why:w,day:n,t:Date.now()}; d.cs=ch; save(); const after=rankIdx(company()); render();
 toast(after>before?'Subiste a '+RANKS[after][0]:'Decisión tomada: '+GRADE[CASES[ch-1].o[d.csel].g][0]); }
function retoCard(n){ const d=dd(n), r=RETOS[(n*7+3)%RETOS.length];
 if(!d.rsOpen) return `<button class="tile reto" onclick="setA(${n},'rsOpen',true,1)"><span class="num">?</span><span class="tx"><h3>Reto sorpresa</h3><span class="mut">Toca para revelarlo · +15 XP</span></span></button>`;
 return `<div class="card stack reto"><div class="eyebrow">Reto sorpresa del día</div><h3>${esc(r)}</h3><label class="chk" for="rsd"><input type="checkbox" id="rsd" ${d.rsDone?'checked':''} onchange="setA(${n},'rsDone',this.checked,1)"><span>Lo hice</span></label></div>`; }
function caseCard(n){ const ch=caseFor(n); if(!ch) return ''; const C=CASES[ch-1], done=!!G().dec[ch]&&dd(n).cs===ch;
 return `<button class="tile" onclick="cur=${n};sess={k:1,s:caseIdx(${n})};render();scrollTo(0,0)"><span class="num">${done?'✓':'C'}</span><span class="tx"><h3>Caso del día</h3><span class="mut">Capítulo ${ch} · ${esc(C.t)}</span></span><span class="go" aria-hidden="true">›</span></button>`; }
function vEmp(){ const s=company(), r=rankIdx(s), k=s.k, L=logros(), D=G().dec;
 const ladder=RANKS.map((x,i)=>`<div class="lad ${i<r?'past':i===r?'now':''}"><span class="n">${i<r?'✓':i+1}</span><span><b>${x[0]}</b><br><span class="mut">${x[1]}</span></span></div>`).reverse().join('');
 const hist=Object.keys(D).map(Number).sort((a,b)=>b-a).map(c=>{const C=CASES[c-1],v=D[c],o=C.o[v.o],gr=GRADE[o.g],op=mOpen==='c'+c; return `<button class="dayrow" aria-expanded="${op}" onclick="mOpen=mOpen==='c${c}'?null:'c${c}';render()"><span class="n ${o.g===1?'l3':o.g>0.5?'l1':''}">${c}</span><span style="flex:1">${esc(C.t)}</span><span class="pill ${gr[1]}">${gr[0]}</span></button>${op?`<div class="learn stack" style="margin:8px 0 12px"><div><b>Decidí: </b>${esc(o.t)}</div><div><b>Por qué: </b>${esc(v.why)}</div><div>${esc(o.r)}</div><div class="ex2"><b>Vida real: </b>${esc(C.real)}</div>${v.fb?`<div class="coach">${esc(v.fb)}</div>`:''}</div>`:''}`}).join('');
 return `<div class="stack"><div class="eyebrow">Tu empresa en la historia</div>
 <div class="card stack"><label class="fl" for="cn">Nombre de tu empresa</label><input type="text" id="cn" value="${esc(coName())}" onchange="G().name=this.value.trim();save();render()"></div>
 <div class="card rankc"><div class="eyebrow">Rango actual</div><div class="big">${RANKS[r][0]}</div><div class="mut">${esc(coName())} · Capítulo ${k} de 28 · ${xp()} XP</div><div class="bar"><i style="width:${Math.round(k/28*100)}%"></i></div></div>
 <div class="card stats5"><div><div class="k">${money(s.v)}</div><div class="mut">Ventas al mes</div></div><div><div class="k">${s.e}</div><div class="mut">Empleados</div></div><div><div class="k">${s.t}</div><div class="mut">Tiendas</div></div><div><div class="k">${s.p}</div><div class="mut">Países</div></div><div><div class="k">${s.m}</div><div class="mut">Reputación</div></div></div>
 <div class="card stack"><h3>Escalera del éxito</h3>${ladder}<div class="mut">Tus decisiones cambian el tamaño de la empresa. Rangos por empleados inspirados en la Ley 905 de 2004; hoy la clasificación oficial en Colombia usa ingresos (Decreto 957 de 2019). Las cifras de la empresa son de la historia, no reales.</div></div>
 <div class="card stack"><h3>Logros</h3><div class="badges">${L.map(([t,dsc,ok])=>`<div class="badge ${ok?'on':''}"><b>${t}</b><span class="mut">${dsc}</span></div>`).join('')}</div></div>
 <div class="card"><h3 style="margin-bottom:6px">Tus decisiones</h3>${hist||'<div class="mut">Aún no has resuelto casos. El caso del día está en tu Bloque profundo.</div>'}</div>
 </div>`; }

let SAMPLE=null, DICT=null, DB=null, coachBusy=false;
const COACH='Eres el Agente Espartano, coach de Salomón Guarín: estratega-entrenador directo, duro y breve. Escribes en español, sin emojis, sin halagos y sin tablas. No inventes datos: si falta uno, dilo. Máximo 150 palabras.';
function coachErr(c){ return c==='not_granted'?'No diste permiso al coach. Puedes copiar el reporte para Claude.':c==='rate_limited'?'Muchas consultas seguidas. Intenta en un minuto.':'No se pudo consultar al coach. Intenta de nuevo.'; }
function coachDayBox(n){ if(!SAMPLE) return ''; const d=dd(n); return `<div class="card stack"><h3>Veredicto del coach</h3><div class="coach" id="cd">${d.coach?esc(d.coach):'<span class="mut">El coach califica tu día con la rúbrica y te deja el reto de mañana.</span>'}</div><button class="${d.coach?'btn2':'btn'}" onclick="coachDay(${n})">${d.coach?'Pedir otro veredicto':'Pedir veredicto del coach'}</button></div>`; }
async function coachDay(n){ if(coachBusy) return; coachBusy=true; const el=$('#cd'); if(el) el.textContent='El coach está leyendo tu día...';
 const p=COACH+'\nCalifica el día de Salomón con 5 ejes de 1 a 5 (una línea por eje): '+RUB+'. Luego: total sobre 25, veredicto en una frase (cumple o no cumple), un patrón si lo ves, y un reto para mañana con hora exacta.\n\n'+dailyReport(n,'claude');
 try{ const {text}=await SAMPLE(p,{cache:false,onText:({text})=>{const e=$('#cd'); if(e) e.textContent=text;}}); dd(n).coach=text; save(); }catch(e){ const x=$('#cd'); if(x) x.textContent=coachErr(e.code); } finally{ coachBusy=false; safeRender(); } }
function coachCaseBox(ch){ if(!SAMPLE) return ''; const v=G().dec[ch]; return `<div class="coach" id="cc">${v.fb?esc(v.fb):'<span class="mut">El coach evalúa tu razonamiento, no solo la opción.</span>'}</div><button class="btn2" onclick="coachCase(${ch})">${v.fb?'Otra evaluación':'Que el coach evalúe mi razonamiento'}</button>`; }
async function coachCase(ch){ if(coachBusy) return; coachBusy=true; const C=CASES[ch-1], v=G().dec[ch], el=$('#cc'); if(el) el.textContent='El coach está analizando tu decisión...';
 const p=COACH+'\nActúa como profesor de casos de negocios estilo Harvard. Evalúa el RAZONAMIENTO de Salomón, no solo la opción. Da: nota de 1 a 5, qué vio bien, qué no vio (riesgo, dato o concepto de mejora continua), qué haría un estratega y una pregunta para pensar más.\n\nCaso: '+C.t+'\nSituación: '+C.sit+'\nDatos: '+C.dat.join('; ')+'\nPregunta: '+C.q+'\nOpciones: '+C.o.map(o=>o.t).join(' | ')+'\nEligió: '+C.o[v.o].t+'\nSu razonamiento: '+v.why+'\nReferencia real: '+C.src+'. '+C.real+'\nLección esperada: '+C.lec;
 try{ const {text}=await SAMPLE(p,{cache:false,onText:({text})=>{const e=$('#cc'); if(e) e.textContent=text;}}); v.fb=text; save(); }catch(e){ const x=$('#cc'); if(x) x.textContent=coachErr(e.code); } finally{ coachBusy=false; safeRender(); } }

let micId=null, micN=null, micK=null;
function micBtn(id,n,k){ return DICT?`<button class="mic" data-id="${id}" onclick="mic('${id}',${n},'${k}')" aria-label="Dictar">Dictar</button>`:''; }
function mic(id,n,k){ if(!DICT) return; if(micId===id){ DICT.stop().catch(()=>{}); return; } micId=id; micN=n; micK=k; DICT.start({language:'es'}).catch(e=>{ micId=null; updateMic(); if(e&&e.code==='not_granted') toast('El dictado está desactivado'); }); updateMic(); }
function updateMic(){ document.querySelectorAll('.mic').forEach(b=>{ const on=b.dataset.id===micId; b.classList.toggle('on',on); b.textContent=on?'Detener':'Dictar'; }); }
function bindDict(){ DICT.onFinal(({text})=>{ if(!micId||!text) return; const el=$('#'+micId), cur0=(el?el.value:dd(micN)[micK])||''; const nv=(cur0?cur0.replace(/\s*$/,' '):'')+text; if(el) el.value=nv; dd(micN)[micK]=nv; save(); }); DICT.onState(({state})=>{ if(state==='idle'){ micId=null; updateMic(); } }); }

/* ---------- Nube (db) ---------- */
const SYNCK='forja-praxis-sync'; let lastH={}, cloud='local', syncT=null;
try{ lastH=JSON.parse(localStorage.getItem(SYNCK))||{}; }catch(e){}
function persistH(){ try{ localStorage.setItem(SYNCK,JSON.stringify(lastH)); }catch(e){} }
function metaOf(){ const m={}; for(const k in S) if(k!=='days') m[k]=S[k]; return m; }
function docsOf(){ const o={meta:metaOf()}; for(const n in S.days) o['d'+n]=S.days[n]; return o; }
function hashOf(x){ const r={}; for(const k in (x||{})) if(k!=='u') r[k]=x[k]; return JSON.stringify(r); }
function refOf(k){ return k==='meta'?DB.doc('forja/meta'):DB.doc('forja/meta/dias/'+k.slice(1)); }
function setCloud(s){ cloud=s; const e=$('#cloud'); if(e) e.textContent=cloudTxt(); }
function cloudTxt(){ return {local:'Tus datos se guardan solo en este navegador. Abre la app en claude.ai con tu sesión iniciada para usar la nube.',loading:'Conectando con la nube...',sync:'Guardando en la nube...',ok:'Sincronizado en la nube: tus datos te siguen en el celular y el computador.',err:'No se pudo conectar con la nube. Tus datos siguen guardados en este navegador.'}[cloud]; }
function schedSync(){ if(!DB||cloud==='loading') return; clearTimeout(syncT); syncT=setTimeout(push,1500); }
async function push(){ if(!DB||cloud==='loading') return; const D=docsOf(), jobs=[];
 for(const k in D){ const h=hashOf(D[k]); if(h!==lastH[k]){ const u=Date.now(); if(k==='meta') S.u=u; else S.days[k.slice(1)].u=u; jobs.push([k,h]); } }
 if(!jobs.length){ setCloud('ok'); return; } setCloud('sync');
 try{ for(const [k,h] of jobs){ const data=k==='meta'?metaOf():S.days[k.slice(1)]; await refOf(k).set(JSON.parse(JSON.stringify(data))); lastH[k]=h; } persistH(); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} setCloud('ok'); }catch(e){ setCloud('err'); } }
async function cloudInit(){ setCloud('loading'); const tm=setTimeout(()=>{ if(cloud==='loading') setCloud('err'); },10000);
 try{ const ms=await DB.doc('forja/meta').get(), qs=await DB.collection('forja/meta/dias').get(); clearTimeout(tm); if(cloud==='err') cloud='loading';
  const R={}; if(ms.exists) R.meta=ms.data(); qs.docs.forEach(x=>{ R['d'+x.id]=x.data(); }); const L=docsOf(); let changed=false;
  if(!Object.keys(lastH).length && R.meta && (S.start||Object.keys(S.days).some(n=>lvl(n)))){ try{ localStorage.setItem('forja-praxis-local-backup',JSON.stringify(S)); }catch(e){} }
  for(const k of new Set([...Object.keys(L),...Object.keys(R)])){ const l=L[k], r=R[k]; if(!r) continue; const dirty=!!l&&(k in lastH)&&hashOf(l)!==lastH[k];
   if(!l || (!dirty && (r.u||0)>(l.u||0))){ if(k==='meta'){ const days=S.days; S=Object.assign({},r,{days}); } else S.days[k.slice(1)]=r; lastH[k]=hashOf(r); changed=true; }
   else if(!dirty) lastH[k]=hashOf(l); }
  persistH(); migrate(); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} cloud='ok'; if(changed){ cur=Math.min(Math.max(dayNum(),1),28); safeRender(); } await push(); setCloud(cloud); }
 catch(e){ clearTimeout(tm); setCloud('err'); } }
async function wipeCloud(){ if(!DB) return; try{ for(const k of Object.keys(lastH)) await refOf(k).delete(); }catch(e){} lastH={}; persistH(); }

function safeRender(){ const a=document.activeElement; if(a&&/INPUT|TEXTAREA/.test(a.tagName)) return; render(); }
function initCaps(){ const C=window.claude; if(!C||typeof C.use!=='function') return;
 C.use('sample').then(s=>{ if(s){ SAMPLE=s; safeRender(); } }).catch(()=>{});
 C.use('dictation').then(d=>{ if(d){ DICT=d; bindDict(); safeRender(); } }).catch(()=>{});
 C.use('db').then(db=>{ if(db){ DB=db; cloudInit(); } }).catch(()=>{}); }

/* ---------- Sugerencias ---------- */
const VN={hoy:'Hoy',emp:'Empresa',plan:'Plan',met:'Método',prog:'Progreso',aj:'Ajustes'};
function sugCtx(){ if(sess){ const S0=sessions(cur)[sess.k]; return `Día ${cur} · ${S0.name} · ${S0.steps[sess.s].t}`; } return VN[view]+(view==='hoy'?' · Día '+cur:''); }
function openSug(){ $('#sgx').textContent='Dónde: '+sugCtx(); $('#sgt').value=''; $('#sg').hidden=false; $('#sgt').focus(); }
function saveSug(){ const x=$('#sgt').value.trim(); if(!x){ $('#sgt').focus(); return; } S.sug.push({t:Date.now(),ctx:sugCtx(),x,done:false}); save(); $('#sg').hidden=true; toast('Sugerencia guardada'); if(!sess&&view==='aj') render(); }
function sugDoc(){ const p=S.sug.filter(s=>!s.done); return `# Sugerencias para mejorar Forja Praxis (${p.length} pendientes)\n`+(p.map(s=>`- [${ymd(new Date(s.t))} · ${s.ctx}] ${s.x}`).join('\n')||'- sin pendientes')+`\n\nClaude: agrúpalas, dime cuáles aplicas primero y por qué, y aplícalas a la app.`; }
function sugCard(){ const L=S.sug.map((s,i)=>({s,i})).reverse(); return `<div class="card stack"><h3>Tus sugerencias</h3><div class="mut">Las que escribes con el botón Sugerir mejora. Cópialas y pégalas en Claude para aplicarlas.</div>${L.length?L.map(({s,i})=>`<div class="opt stack" style="gap:6px;${s.done?'opacity:.55':''}"><div>${esc(s.x)}</div><div class="mut" style="font-size:14px">${ymd(new Date(s.t))} · ${esc(s.ctx)}</div><div class="actions"><button class="btn2" style="padding:8px 12px" onclick="S.sug[${i}].done=!S.sug[${i}].done;save();render()">${s.done?'Reabrir':'Resuelta'}</button><button class="btn2" style="padding:8px 12px" onclick="S.sug.splice(${i},1);save();render()">Borrar</button></div></div>`).join(''):'<div class="mut">Aún no tienes sugerencias.</div>'}<button class="btn" onclick="copyTxt('sgd',sugDoc())">Copiar para Claude</button><textarea id="sgd" aria-label="Sugerencias en texto" hidden></textarea></div>`; }

function vAj(){
 const T=S.targets;
 return `<div class="stack"><h1>Ajustes</h1>
 <div class="card stack"><h3>Metas</h3><div class="mut">Fíjalas al terminar la semana 1, con tus datos reales.</div><div><label class="fl" for="tb">Meta de sesiones cumplidas (%)</label><input type="number" id="tb" min="0" max="100" value="${T.blocks??''}" onchange="S.targets.blocks=this.value===''?null:+this.value;save()"></div><div><label class="fl" for="tm2">Meta de mejoras y acciones incómodas por semana</label><input type="number" id="tm2" min="0" value="${T.mej??''}" onchange="S.targets.mej=this.value===''?null:+this.value;save()"></div><div><label class="fl" for="pn">Proyectos activos hoy (meta: 1)</label><input type="number" id="pn" min="0" value="${S.projNow??1}" onchange="S.projNow=+this.value;save()"></div></div>
 <div class="card stack"><h3>Fecha de inicio</h3><div><label class="fl" for="sd">AAAA-MM-DD</label><input type="text" id="sd" value="${S.start||''}" placeholder="2026-11-11"></div><button class="btn2" onclick="setStart()">Guardar fecha</button></div>
 <div class="card stack"><h3>Nube</h3><div id="cloud">${cloudTxt()}</div>${(()=>{try{return localStorage.getItem('forja-praxis-local-backup')?`<div class="mut">Al conectar la nube se guardó una copia de lo que tenía este navegador.</div><button class="btn2" onclick="restore(localStorage.getItem('forja-praxis-local-backup'))">Recuperar los datos anteriores de este navegador</button>`:''}catch(e){return ''}})()}</div>
 <div class="card stack"><h3>Respaldo</h3><div class="mut">Copia extra de seguridad. Guárdala en tus notas de vez en cuando.</div><button class="btn" onclick="copyBk()">Copiar respaldo</button><div><label class="fl" for="bk">Para restaurar, pega aquí tu respaldo</label><textarea id="bk"></textarea></div><button class="btn2" onclick="restore($('#bk').value)">Restaurar</button></div>
 ${sugCard()}
 <div class="msg" id="msg">${esc(msg)}</div>
 <div class="card stack"><h3>Reiniciar</h3>${confirmReset?`<div class="mut">Esto borra todo tu registro y no se puede deshacer.</div><div class="actions"><button class="btn" onclick="doReset()">Sí, borrar todo</button><button class="btn2" onclick="confirmReset=false;render()">Cancelar</button></div>`:`<button class="btn2" onclick="confirmReset=true;render()">Borrar todos los datos</button>`}</div></div>`;
}
function say(t){ msg=t; const m=$('#msg'); if(m) m.textContent=t; }
function setStart(){ const v=$('#sd').value.trim(); if(/^\d{4}-\d{2}-\d{2}$/.test(v)){S.start=v;save();toast('Fecha guardada');render();} else say('Escribe la fecha como AAAA-MM-DD.'); }
function copyBk(){ const t=$('#bk'), txt=JSON.stringify(S); t.value=txt; navigator.clipboard.writeText(txt).then(()=>toast('Respaldo copiado'),()=>{t.select();say('Texto seleccionado: cópialo manualmente.');}); }
function restore(txt){ try{const o=JSON.parse(txt); if(o.schema!==SCHEMA||!o.days) throw 0; S=o; migrate(); save(); toast('Datos restaurados'); render();}catch(e){ say('Ese texto no es un respaldo válido de Forja Praxis.'); } }
async function doReset(){ try{localStorage.removeItem(KEY);}catch(e){} await wipeCloud(); S=load(); confirmReset=false; toast('Datos borrados'); render(); }

migrate();
cur=Math.min(Math.max(dayNum(),1),28);
render();
initCaps();
</script>
