<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: una columna amplia; Hoy = 3 sesiones grandes; cada sesion = un paso por pantalla */
:root{
 --bg:#f5f3f0;--card:#ffffff;--line:#e4dfda;--tx:#1d1a18;--mut:#6b6460;--ac:#b5432c;--acs:#f6e3dd;--ok:#3f8a4f;--oks:#e1efe3;--warn:#a87a0c;--field:#fbfaf9;--on-ac:#ffffff;
 --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--body:'Inter',system-ui,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141211;--card:#1e1b1a;--line:#322e2b;--tx:#f3f0ed;--mut:#a69d98;--ac:#e0705a;--acs:#3a231d;--ok:#76b77a;--oks:#1e3122;--warn:#d9a441;--field:#100f0e;--on-ac:#ffffff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141211;--card:#1e1b1a;--line:#322e2b;--tx:#f3f0ed;--mut:#a69d98;--ac:#e0705a;--acs:#3a231d;--ok:#76b77a;--oks:#1e3122;--warn:#d9a441;--field:#100f0e;--on-ac:#ffffff;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--tx);font:18px/1.55 var(--body);max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(110px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,.k,.big{font-family:var(--display);letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:44px;line-height:1}h2{font-size:30px;line-height:1.1}h3{font-size:24px;line-height:1.15}
.mut{color:var(--mut);font-size:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.eyebrow{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:600}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac);color:var(--on-ac);border:0;border-radius:12px;padding:16px 20px;font-weight:600;font-size:18px;width:100%}
.btn2{background:none;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:14px 18px;font-size:17px}
.btn:focus-visible,.btn2:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
input[type=text],input[type=number],textarea{width:100%;background:var(--field);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:14px;font:inherit;font-size:18px}
textarea{min-height:110px;resize:vertical}
label.fl{display:block;font-weight:600;margin-bottom:6px}
.hero{display:flex;align-items:center;gap:16px;justify-content:space-between;padding-top:8px}
.ring{width:84px;height:84px;flex:none}
.ring circle{fill:none;stroke-width:9}.ring .bgc{stroke:var(--line)}.ring .fgc{stroke:var(--ac);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring text{font:700 22px var(--display);fill:var(--tx)}
.quote{font-size:20px;font-style:italic;border-left:4px solid var(--ac);padding:4px 0 4px 14px}
.tile{display:flex;gap:16px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;color:var(--tx);width:100%}
.tile .num{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:700 26px var(--display);background:var(--acs);color:var(--ac);flex:none}
.tile.done .num{background:var(--ok);color:var(--on-ac)}
.tile .tx{flex:1;min-width:0}
.tile .go{font-size:28px;color:var(--mut)}
.pill{display:inline-block;padding:3px 12px;border-radius:99px;font-size:14px;font-weight:600;background:var(--acs);color:var(--ac)}
.pill.ok{background:var(--oks);color:var(--ok)}.pill.nt{background:none;border:1px solid var(--line);color:var(--mut)}
.dots{display:flex;gap:8px}.dots i{height:6px;flex:1;border-radius:3px;background:var(--line)}.dots i.on{background:var(--ac)}
ol.do{margin:0;padding-left:26px;display:flex;flex-direction:column;gap:10px;font-size:19px}
ol.do li::marker{font-weight:700;color:var(--ac)}
.why{background:var(--acs);border-radius:12px;padding:14px 16px;font-size:16px}
.why b{color:var(--ac)}
.scale{display:flex;gap:8px}.scale button{flex:1;padding:14px 0;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--tx);font:700 22px var(--display)}
.scale button.on{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{border:1px solid var(--line);background:var(--field);color:var(--tx);border-radius:99px;padding:8px 14px;font-size:16px}
.chips button.on{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.chk{display:flex;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--field);font-size:18px}
.chk input{width:26px;height:26px;accent-color:var(--ac);flex:none}
.actions{display:flex;gap:10px}.actions .btn2{flex:0 0 auto}
.timer{font:700 64px var(--display);text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stats>div{min-width:0}
.k{font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.heat button{aspect-ratio:1;max-width:100%;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--tx);font:600 16px var(--body);font-variant-numeric:tabular-nums}
.heat .l1{background:var(--acs)}.heat .l2{background:var(--warn);color:var(--on-ac);border-color:var(--warn)}.heat .l3{background:var(--ok);color:var(--on-ac);border-color:var(--ok)}
.heat .cur{outline:3px solid var(--ac);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--mut)}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line)}
.chart{width:100%;height:auto}.chart .grid{stroke:var(--line)}.chart text{fill:var(--mut);font:11px var(--body)}.chart .ln{fill:none;stroke:var(--ac);stroke-width:2.5}.chart .pt{fill:var(--ac)}
.dayrow{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--tx)}
.dayrow:last-child{border-bottom:0}
.dayrow .n{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 20px var(--display);border:1px solid var(--line);flex:none}
.dayrow .n.l3{background:var(--ok);color:var(--on-ac);border-color:var(--ok)}.dayrow .n.l1,.dayrow .n.l2{background:var(--acs);color:var(--ac)}
.dayrow.cur .n{outline:3px solid var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav button{flex:1;max-width:150px;background:none;border:0;color:var(--mut);padding:16px 2px;font-weight:600;font-size:15px}
nav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:9}
.msg{color:var(--ac);font-weight:600;min-height:1.2em}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:16px;font-variant-numeric:tabular-nums}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
@media (max-width:420px){h1{font-size:38px}.k{font-size:32px}ol.do{font-size:18px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.learn{background:var(--card);border:2px solid var(--ac);border-radius:16px;padding:18px}
.ex2{font-size:16px}.ex2 b{color:var(--ac)}
.kq{font-weight:600;font-size:18px;border-top:1px solid var(--line);padding-top:10px}
.lbtn{background:var(--acs);color:var(--ac);border:0;border-radius:12px;padding:12px 16px;font-weight:600;font-size:17px;text-align:left;width:100%}
.lbtn .mut{color:var(--ac);opacity:.75}
.opt{border:1px solid var(--line);border-radius:12px;padding:12px}
.timerc{display:flex;flex-direction:column;gap:10px;text-align:center}
.timerc .timer{font-size:52px}
.actions.col{flex-direction:column}.actions.col button{width:100%}
.sgb{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--card);color:var(--ac);border:1px solid var(--ac);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.12)}.sgb.low{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sgo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center;padding:16px}.sgc{width:100%;max-width:640px}
.opt2{display:block;width:100%;text-align:left;background:var(--field);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}.opt2 b{color:var(--ac);margin-right:6px}.opt2.on{border:2px solid var(--ac);background:var(--acs)}
.case{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.res{border-left:4px solid var(--ac);padding-left:12px}
.pill.bad{background:var(--acs);color:var(--ac);border:1px solid var(--ac)}.pill.rk{border:0;margin-top:8px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.flrow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}.flrow .fl{flex:1}.mic{background:none;border:1px solid var(--ac);color:var(--ac);border-radius:99px;padding:4px 12px;font-size:14px;font-weight:600;margin-bottom:6px;flex:none}.mic.on{background:var(--ac);color:var(--on-ac)}
.coach{white-space:pre-wrap;background:var(--field);border-radius:12px;padding:14px;font-size:17px}
.tile.reto .num{background:var(--tx);color:var(--bg)}.card.reto{border:2px solid var(--ac)}
.rankc .big{font:700 40px/1.05 var(--display);margin:6px 0}.bar{height:10px;border-radius:5px;background:var(--line);margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.stats5{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.stats5 .k{font-size:26px}
.lad{display:flex;gap:12px;align-items:center;padding:8px 0;opacity:.5}.lad .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font:700 17px var(--display);flex:none}.lad.past{opacity:.8}.lad.past .n{background:var(--oks);color:var(--ok);border-color:var(--ok)}.lad.now{opacity:1}.lad.now .n{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.badge{border:1px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;opacity:.5;font-size:15px}.badge.on{opacity:1;border:2px solid var(--ok)}
ul.rep{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:17px}
.ph{cursor:default}.ph.lock{opacity:.7}
</style>
<div id="app"></div>
<nav id="nav"></nav>
<div id="toast" class="toast" hidden></div>
<button id="sgb" class="sgb" onclick="openSug()">Sugerir mejora</button>
<div id="sg" class="sgo" hidden><div class="card stack sgc" role="dialog" aria-label="Sugerir mejora"><h3>Sugerir mejora</h3><div class="mut" id="sgx"></div><textarea id="sgt" aria-label="Tu sugerencia" placeholder="¿Qué mejorarías aquí?"></textarea><div class="actions"><button class="btn" onclick="saveSug()">Guardar</button><button class="btn2" onclick="$('#sg').hidden=true">Cancelar</button></div></div></div>
<script>
const SCHEMA=1, KEY='forja-praxis-v1';
const TOOLS=['Gemba + 5S','PHVA + 7 desperdicios','Restricciones + estándar','Kaizen 1%'];
const WASTES=['Espera','Sobreproducción de ideas','Movimiento sin avance','Retrabajo','Inventario sin aplicar','Planear sin ejecutar','Transporte','Talento sin usar'];

const LEARN={
 unacosa:{t:'La Una Cosa',que:'La tarea que, si la haces, vuelve todo lo demás más fácil o innecesario. No es la más urgente: es la que más mueve tu resultado.',fab:'Una planta con 20 problemas ataca primero el que frena a los otros 19.',vida:'Si defines a qué clientes sirve Praxis, tu marca, tu oferta y tu agenda se ordenan solas.',q:'¿Qué hago hoy que vuelva lo demás más fácil o innecesario?',src:'Keller, Solo una cosa'},
 metas:{t:'Metas al ahora',src:'Keller, Solo una cosa',que:'Bajar una meta grande, nivel por nivel, hasta lo que haces ahora mismo. Cada nivel prepara el siguiente, como fichas de dominó.',fab:'La meta anual de productividad se vuelve la meta del mes, la de la semana y la del turno de hoy.',vida:'Praxis con clientes en 90 días se vuelve una conversación con un empresario esta semana y una lista de 10 contactos hoy.',q:'¿Qué debo hacer hoy para que la meta de la semana sea posible?'},
 gemba:{t:'Gemba',src:'Lean',que:'Gemba significa el lugar real: donde pasa el trabajo. En vez de suponer, vas, miras con tus ojos y registras datos.',fab:'El gerente no mira el reporte de paradas: va a la máquina, observa 30 minutos y anota qué la detiene.',vida:'No supones en qué se va tu mañana: la registras cada 10 minutos y miras los datos.',q:'¿Qué está pasando de verdad, no lo que creo que pasa?'},
 s5:{t:'5S',src:'Lean',que:'Método para ordenar un espacio en 5 pasos: Clasificar, Ordenar, Limpiar, Estandarizar y Disciplina. Un espacio ordenado muestra los problemas y elimina búsquedas.',fab:'Herramientas con su silueta pintada en la pared: si falta una, se ve al instante.',vida:'Escritorio con solo lo de tu Una Cosa, celular fuera y archivos donde siempre están.',q:'¿Qué sobra, qué falta y qué está fuera de lugar?'},
 seiri:{t:'Seiri: Clasificar',src:'5S',que:'Separar lo necesario de lo innecesario y sacar lo innecesario. Lo dudoso recibe una tarjeta roja con fecha: si no lo usas en 30 días, sale.',fab:'Se retiran de la línea los moldes que no se usan hace un año.',vida:'Sacas de tu escritorio y tu celular todo lo que no usas cada semana.',q:'¿Lo uso cada semana? Si no, ¿por qué está aquí?'},
 seiton:{t:'Seiton: Ordenar',src:'5S',que:'Un lugar para cada cosa y cada cosa en su lugar, nombrado y cerca de donde se usa. La meta: encontrar cualquier cosa en 30 segundos.',fab:'Cada estante lleva etiqueta y cada herramienta vuelve a su silueta.',vida:'Carpeta Praxis con subcarpetas fijas y un sitio fijo para cuaderno, cargador y llaves.',q:'¿Lo encuentro en menos de 30 segundos?'},
 seiso:{t:'Seiso: Limpiar',src:'5S',que:'Limpiar es inspeccionar: al limpiar ves lo que falla. Y buscas la fuente de la suciedad para cortarla.',fab:'Al limpiar una máquina el operario descubre una fuga de aceite antes de que cause una parada.',vida:'Vaciar la bandeja de entrada te muestra qué compromisos dejaste abiertos.',q:'¿De dónde viene el desorden y cómo lo corto en la fuente?'},
 seiketsu:{t:'Seiketsu: Estandarizar',src:'5S',que:'Dejar escrito y visible cómo debe verse el lugar ordenado, para que mantenerlo no dependa de la memoria.',fab:'Foto del puesto ideal pegada al lado del puesto real.',vida:'Foto de tu escritorio ordenado y una rutina de 5 minutos para dejarlo igual cada día.',q:'¿Cualquier persona sabría cómo debe quedar esto?'},
 shitsuke:{t:'Shitsuke: Disciplina',src:'5S',que:'Sostener el estándar todos los días y auditarlo. Sin disciplina, las 4 S anteriores se pierden en dos semanas.',fab:'Auditoría semanal de 5S con puntaje visible para el equipo.',vida:'Cada domingo calificas tu 5S del 1 al 5 con datos.',q:'¿Lo sostuve esta semana? ¿Cómo lo sé?'},
 phva:{t:'PHVA',src:'Deming',que:'Ciclo de mejora: Planear, Hacer, Verificar y Actuar. Planeas un cambio pequeño, lo haces, mides si funcionó y decides si se vuelve estándar.',fab:'Se prueba un cambio en una sola línea, se mide una semana y solo si funciona se aplica a toda la planta.',vida:'Apertura es Planear, el bloque es Hacer, el Cierre es Verificar y la mejora de mañana es Actuar.',q:'¿Qué planeé, qué pasó y qué ajusto?'},
 muda:{t:'Los 8 desperdicios',src:'Lean, Taiichi Ohno',que:'Todo lo que consume tiempo o recursos sin agregar valor: espera, sobreproducción, inventario, movimiento, transporte, retrabajo, sobreprocesamiento y talento sin usar.',fab:'Un operario camina 2 km por turno buscando piezas: es movimiento sin valor.',vida:'Diez ideas abiertas son sobreproducción; libros sin aplicar son inventario; planear sin ejecutar es sobreprocesamiento.',q:'¿Esto agrega valor a mi Una Cosa o solo consume tiempo?'},
 porques:{t:'5 porqués',src:'Lean',que:'Preguntar por qué cinco veces seguidas para pasar del síntoma a la causa raíz. Se corrige la causa, no el síntoma.',fab:'La máquina paró. ¿Por qué? Se fundió un fusible. ¿Por qué? Sobrecarga. ¿Por qué? Falta lubricación... hasta llegar a la bomba que no se revisa.',vida:'No termino las cosas. ¿Por qué? Cambio de proyecto. ¿Por qué? Me aburro sin resultados rápidos...',q:'¿Por qué pasó? ¿Y por qué pasó eso?'},
 toc:{t:'Teoría de Restricciones',src:'Goldratt',que:'Todo sistema tiene un eslabón que limita su resultado. Mejorar otra cosa no sirve. Pasos: identificar la restricción, explotarla, subordinar todo a ella, elevarla y repetir.',fab:'Si una máquina produce 100 y las demás 200, la planta produce 100. Se mejora esa máquina primero.',vida:'Si tu restricción es la dispersión, cualquier otra mejora se pierde en el próximo cambio de proyecto.',q:'¿Qué es lo que más limita mi avance hoy?'},
 estandar:{t:'Trabajo estandarizado',src:'Lean',que:'La mejor forma conocida hoy de hacer una tarea, escrita. No es rígido: es la base para mejorar. Sin estándar no sabes si mejoraste.',fab:'Hoja de trabajo con secuencia, tiempo y puntos clave en cada puesto.',vida:'Tu mañana escrita hora por hora: si te desvías, lo ves y lo corriges.',q:'¿Cuál es la mejor forma que conozco hoy de hacer esto?'},
 pokayoke:{t:'Poka-yoke',src:'Shigeo Shingo',que:'Diseñar el entorno para que el error sea imposible o se note al instante. No depender de la fuerza de voluntad.',fab:'Una pieza que solo encaja en una posición: no se puede montar al revés.',vida:'El celular en otro cuarto hace imposible revisarlo durante el bloque.',q:'¿Cómo hago que el error sea imposible, no solo improbable?'},
 andon:{t:'Andon',src:'Lean',que:'Una señal para detener el trabajo cuando aparece un problema, en vez de seguir y esconderlo. Parar a tiempo es más barato que corregir después.',fab:'El operario tira de una cuerda, se enciende una luz y el líder llega a ayudar.',vida:'Al notar que te desviaste, te detienes, respiras un minuto, lees tu Una Cosa y vuelves.',q:'¿Cuál es mi señal para detenerme y volver?'},
 kaizen:{t:'Kaizen',src:'Lean',que:'Mejora continua en pasos pequeños y medidos, todos los días. Mejorar 1% diario es sostenible; los cambios gigantes casi nunca lo son.',fab:'Cada semana el equipo hace una mejora pequeña en su puesto y la mide.',vida:'Una mejora diaria en tu rutina, medida, durante 28 días.',q:'¿Qué puedo mejorar 1% hoy y cómo lo mido?'},
 experimento:{t:'Experimento personal',src:'Kaizen · PHVA',que:'Probar una mejora como un científico: hipótesis, un solo cambio, una métrica y una fecha. Si cambias varias cosas a la vez, no sabes qué funcionó.',fab:'Se prueba una nueva secuencia solo en el turno de la mañana y se compara con la tarde.',vida:'Si trabajo antes de abrir el celular, mis minutos en la Una Cosa suben. Lo pruebo 3 días.',q:'¿Qué cambio, qué mido y cuándo evalúo?'},
 sientonces:{t:'Plan si-entonces',src:'Gollwitzer',que:'Decidir antes qué harás cuando aparezca un obstáculo: Si pasa X, entonces hago Y. Es de las técnicas con más evidencia para cumplir metas.',fab:'Si la máquina pasa de 80 °C, entonces se detiene y se avisa a mantenimiento.',vida:'Si me dan ganas de abrir redes, entonces escribo la idea en la lista de espera y vuelvo.',q:'¿Qué me va a frenar hoy y qué haré cuando pase?'},
 woop:{t:'WOOP',src:'Oettingen',que:'Deseo, mejor resultado, obstáculo interno y plan. Imaginar solo el éxito puede bajar tu esfuerzo; contrastarlo con el obstáculo lo sube.',fab:'Antes del lanzamiento, el equipo escribe el resultado deseado y lo que dentro del equipo puede fallar.',vida:'Deseo: cumplir la semana. Obstáculo: mi aburrimiento. Plan: si me aburro, cambio de lugar pero no de tarea.',q:'¿Qué en mí puede impedirlo?'},

const EXJ={
 gemba:R('El observador silencioso','2 estaciones, piezas de cilindro, plano de la planta dibujado en papel periódico, marcadores, cronómetro.','3 ensambladores, 2 observadores, 1 cronometrista.','Los ensambladores arman cilindros durante 5 minutos. Los observadores, sin hablar, trazan en el plano cada desplazamiento y marcan con una X cada espera.','Con el plano en la mano, el equipo cambia una sola cosa de la planta.','Otros 5 minutos. Comparan trazos, X y cilindros terminados.','Antes de ver el plano, un "gerente" adivina dónde está el mayor problema. Luego lo compara con lo observado.','Lo que se supone desde la oficina no coincide con lo que pasa en el lugar.','¿Qué decisión tomaste este mes sin ir al lugar?','¿Qué camino repites cada día que podrías acortar?'),
 seiri:R('Tarjeta roja en la estación','Una estación con piezas de 3 cilindros mezcladas con tornillos sobrantes, herramientas que no se usan y papeles; papel rojo; cronómetro.','2 ensambladores, 1 auditor con tarjetas rojas, 1 cronometrista.','Arman 1 cilindro buscando en el desorden. Se toma el tiempo.','3 minutos para poner tarjeta roja a todo lo que no sirve para este cilindro y sacarlo de la estación.','Arman otro cilindro y comparan el tiempo.','El facilitador pide un cilindro de otro tamaño: deciden qué vuelve de la zona roja y qué no.','Lo que sobra frena aunque nadie lo note.','¿Qué proyecto o gasto de tu empresa merece tarjeta roja?','¿Qué hay en tu puesto que no usaste esta semana?'),
 digital:R('La orden perdida','10 órdenes de producción en papel (cantidad, tamaño, fecha) mezcladas con 20 papeles inútiles; una estación; papel periódico; marcadores; cronómetro.','1 planeador, 2 ensambladores, 1 cronometrista.','El planeador busca la orden urgente y la entrega. Los ensambladores esperan. Se mide el tiempo de búsqueda.','El equipo dibuja en papel periódico un tablero de 3 columnas: por hacer, en proceso, hecho. Ubica las órdenes y bota lo inútil.','Llega otra orden urgente: la encuentran con el tablero.','Llegan 3 órdenes a la vez y una cambia de prioridad a mitad de la ronda.','La información desordenada para la planta igual que una pieza perdida.','¿Cuánto tarda tu equipo en encontrar un dato clave?','¿Dónde buscas tu orden del día?'),
 seiton:R('Cada pieza en su silueta','Estación, piezas de cilindro, destornilladores, papel periódico, marcadores, cronómetro.','3 ensambladores que rotan, 1 cronometrista.','Cada uno arma 1 cilindro con piezas y herramientas amontonadas.','Dibujan en papel periódico la silueta de cada pieza y herramienta, en el orden de uso, y la ponen sobre la mesa.','Arman otra vez y comparan tiempos.','Un participante que no vio nada arma solo guiado por las siluetas.','Un lugar para cada cosa hace que cualquiera encuentre todo.','¿Tu empresa funciona si falta quien sabe dónde está todo?','¿Qué herramienta buscas más veces al día?'),
 seiso:R('Limpia y encuentra','4 cilindros armados; el facilitador deja 2 fallas escondidas (un tornillo flojo, una pieza mal puesta); paños; papel; cronómetro.','Inspectores en parejas, 1 facilitador.','Inspeccionan solo mirando durante 2 minutos y anotan fallas.','Definen una rutina de limpieza que obliga a tocar y ajustar cada pieza con el paño.','Nuevo lote con otras fallas: aplican la rutina y anotan.','Diseñan en papel la tarjeta de limpieza e inspección de 1 minuto para la estación.','Limpiar tocando es inspeccionar.','¿Qué revisas solo de lejos, en un informe?','¿Qué falla has descubierto limpiando?'),
 seiketsu:R('El estándar que sobrevive','Estación, piezas, herramientas, papel periódico, marcadores, cronómetro.','Equipo A (ordena), equipo B (mantiene), 1 auditor.','El equipo A ordena la estación y dibuja el estándar visual en papel periódico.','El auditor desordena la estación en 30 segundos.','El equipo B, que no la ordenó, la deja igual al estándar solo con el dibujo. Se mide tiempo y diferencias.','Cambio de turno tres veces: el estándar debe sobrevivir a cada equipo nuevo.','Si el estándar no se entiende sin explicarlo, no es estándar.','¿Qué de tu empresa depende de que alguien lo explique?','¿Cómo sabe el turno siguiente cómo debe quedar tu puesto?'),
 s5:R('Auditoría 5S en 10 minutos','Estación desordenada, piezas, herramientas, papel periódico con un formato de 5 renglones, marcadores, cronómetro.','Equipo 5S y 1 auditor de otro equipo.','2 minutos por cada S: clasificar, ordenar, limpiar, estandarizar y disciplina.','El auditor califica cada S de 1 a 5 con evidencia. El equipo elige la S más baja.','2 minutos solo en esa S y nueva auditoría.','El auditor vuelve sin aviso al final de la sesión.','Sin auditoría y disciplina, el orden se pierde.','¿Qué auditas de verdad en tu empresa?','¿Cuál S se te cae primero?'),
 espera:R('El que espera, pierde','3 estaciones en línea, piezas de cilindro, 1 cronómetro por estación.','3 ensambladores (base y camisa, pistón, tapa y ajuste), 3 cronometristas que miden solo el tiempo que su ensamblador espera.','Producen 5 minutos pasando cilindros en grupos de 5.','El equipo decide cómo pasar el trabajo para esperar menos.','5 minutos con el nuevo método. Comparan tiempo de espera y cilindros terminados.','El facilitador detiene la estación del medio 1 minuto: miden cómo se propaga la espera.','La espera de uno se vuelve la espera de todos.','¿Qué decisión tuya tiene a alguien esperando hoy?','¿A quién esperas tú cada día y por qué?'),
 sobreprod:R('Producir sin pedido','Estaciones, piezas de cilindros de dos tamaños, tarjetas de pedido en papel, cronómetro.','3 ensambladores, 1 cliente con tarjetas, 1 almacenista.','Producen todo lo que puedan durante 5 minutos. Al final el cliente revela sus pedidos. Cuentan lo que sobra.','Regla nueva: solo se arma lo que pide una tarjeta.','5 minutos con tarjetas. Comparan sobrante y pedidos cumplidos.','El cliente cambia el pedido a mitad de la ronda.','Producir antes del pedido llena la planta de lo que nadie compra.','¿Qué produces hoy sin que nadie lo haya pedido?','¿Qué haces "por si acaso"?'),
 inventario:R('La bodega que esconde','Piezas de cilindro, zona de bodega marcada con papel, sistema de transporte de insumos, cronómetro.','1 bodeguero, 1 transportador, 3 ensambladores, 1 inspector.','Bodega llena. El facilitador esconde 2 piezas defectuosas al fondo. Producen 5 minutos y anotan cuándo aparece el defecto.','Nueva regla: en cada estación solo cabe material para 2 cilindros.','Repiten con otros 2 defectos escondidos. ¿Aparecen antes?','Cambio de tamaño de cilindro: cuentan cuánto material viejo queda sin uso.','El inventario esconde los defectos y retrasa su descubrimiento.','¿Cuánto dinero tienes quieto en bodega?','¿Qué material se acumula junto a tu puesto?'),
 movimiento:R('Cuenta tus pasos','Estaciones separadas, piezas y herramientas lejos de quien las usa, papel y marcador para contar, cronómetro.','Ensambladores y 1 contador de pasos por cada uno.','Arman 3 cilindros. Los contadores registran pasos y estiramientos de cada ensamblador.','Rediseñan la ubicación: todo al alcance de la mano y en orden de uso.','Repiten y comparan pasos y tiempo.','Ensamblar sin levantarse de la silla y sin perder calidad.','Cada paso que no agrega valor se puede medir y eliminar.','¿Cuántos pasos da un pedido en tu empresa antes de llegar al cliente?','¿Qué buscas lejos varias veces al día?'),
 retrabajo:R('Bien a la primera','Piezas, destornilladores, una instrucción de ensamble ambigua escrita en papel, cronómetro.','Ensambladores, 1 inspector final, 1 cronometrista.','Arman con la instrucción ambigua. El inspector rechaza los que fallan. Cuentan rechazos.','Aplican 5 porqués al rechazo más común y reescriben la instrucción.','Repiten y comparan rechazos.','Un participante sin experiencia arma solo con la nueva instrucción.','El retrabajo nace en la causa, no en la persona.','¿Qué rehace tu equipo cada semana?','¿Qué te devuelven más seguido y por qué?'),
 sobreproc:R('Lo que el cliente paga','Piezas, destornilladores, paños, marcadores, una hoja con lo que el cliente valora (sellada hasta la mejora), cronómetro.','Ensambladores, 1 cliente, 1 cronometrista.','El facilitador pide "el mejor cilindro posible". Los equipos agregan pasos: limpiar, marcar, reapretar, revisar.','El cliente abre su hoja: solo valora 3 cosas. El equipo elimina lo que no está en la lista.','Repiten y comparan tiempo y aprobación del cliente.','El cliente pide la mitad del tiempo con la misma calidad.','Hacer más de lo que el cliente valora es desperdicio.','¿Qué haces que tu cliente no pagaría?','¿Qué paso haces de más por costumbre?'),
 talento:R('El operario tiene la respuesta','Línea de ensamble, piezas, papel periódico, marcadores, cronómetro.','1 gerente que no puede tocar piezas, operarios.','El gerente decide solo cómo se trabaja y da órdenes. Producen 5 minutos.','El gerente solo puede preguntar. Los operarios rediseñan la línea.','5 minutos más. Comparan producción y ánimo del equipo.','Cada operario explica su puesto a otro en 1 minuto y cambian de puesto.','Quien hace el trabajo sabe cómo mejorarlo.','¿Cuándo fue la última vez que preguntaste antes de ordenar?','¿Qué idea tienes que nadie te ha preguntado?'),
 toc:R('Una sola mejora','4 estaciones en línea, piezas, 1 cronómetro por estación, papel periódico.','4 ensambladores, cronometristas, 1 analista.','Producen 5 minutos. Miden el tiempo de cada estación y cuentan las piezas que se acumulan frente a cada una.','El equipo solo puede mejorar una estación. La elige con los datos.','5 minutos más. ¿Subió la producción?','El facilitador ofrece mejorar otra estación que no es la restricción: el equipo predice el resultado y lo prueba.','Mejorar donde no está la restricción no sube el resultado.','¿Qué limita hoy las ventas o la producción de tu empresa?','¿Dónde se acumula trabajo frente a ti?'),
 estandar:R('La hoja que enseña','Piezas, destornilladores, papel periódico, marcadores, cronómetro.','1 experto, 2 aprendices, 1 observador.','El experto arma un cilindro explicando de palabra. El primer aprendiz repite. El observador cuenta errores y tiempo.','El experto escribe la hoja estándar: secuencia, tiempo y punto clave por paso.','El segundo aprendiz arma solo con la hoja, sin preguntar.','El aprendiz mejora la hoja y se la enseña a otra persona.','Un estándar se prueba con quien lo ejecuta, no con quien lo escribe.','¿Qué proceso de tu empresa vive solo en la cabeza de alguien?','¿Cómo le enseñarías tu puesto a alguien nuevo en 5 minutos?'),
 estandar2:R('El estándar bajo presión','La hoja estándar de un ensamble, piezas, destornilladores, cronómetro.','Ensambladores, 1 auditor del estándar.','Producen 5 minutos siguiendo la hoja. El auditor anota cada desviación.','Si una desviación se repite, el equipo cambia la hoja o pone una barrera.','5 minutos más. Comparan desviaciones y producción.','La meta sube un cilindro más sin romper el estándar.','El estándar es la base para mejorar, no una cárcel.','¿Tus estándares se cumplen cuando hay afán?','¿Qué paso te saltas cuando vas tarde?'),
 pokayoke:R('Imposible equivocarse','Piezas del cilindro, papel, marcadores, cinta, cronómetro.','Ensambladores con prisa, 1 diseñador, 1 inspector.','Arman contra el reloj. El inspector cuenta errores: piezas al revés, tornillos que faltan.','El equipo diseña con papel y marcador una guía que haga imposible el error: siluetas, un círculo por tornillo, flechas de posición.','Repiten y comparan errores.','Un participante intenta equivocarse a propósito: ¿la guía lo detiene?','Un buen diseño evita el error sin depender de la memoria.','¿Qué error de tu empresa depende solo de "tener cuidado"?','¿Qué error te ha pasado más de una vez?'),
 andon:R('Para la línea','Línea de estaciones, piezas, una pieza con defecto escondido, papel rojo como señal, cronómetro.','Ensambladores, 1 líder de línea, 1 cronometrista.','Producen 5 minutos. Regla: nadie puede parar. Al final cuentan cilindros malos.','Cualquiera puede levantar el papel rojo. La línea para y el líder llega en menos de 30 segundos.','Repiten con otro defecto escondido.','Dos defectos a la vez y un solo líder.','Detenerse a tiempo produce más que esconder el problema.','¿Tu equipo se atreve a parar cuando algo va mal?','¿Qué haces cuando ves un problema y vas con afán?'),
 subordinar:R('Al ritmo del más lento','Línea de 4 estaciones, piezas, papel periódico, cronómetro.','Ensambladores, 1 abastecedor, 1 "tambor" en la estación más lenta.','Cada estación trabaja a su máxima velocidad. Cuentan las piezas acumuladas entre estaciones.','El abastecedor solo entrega piezas cuando el tambor avisa que terminó una.','5 minutos más. Comparan acumulación y cilindros terminados.','Dejan un pequeño colchón de piezas solo antes de la estación más lenta y prueban.','Subordinar todo a la restricción reduce el caos sin trabajar más.','¿Tu empresa trabaja al ritmo de su restricción o al de cada área?','¿Produces más rápido de lo que el siguiente puede recibir?'),
 sistema:R('No es la persona, es el sistema','Piezas buenas mezcladas con defectuosas en el sistema de transporte de insumos, destornilladores, cronómetro.','1 supervisor, ensambladores, 1 analista.','Tres rondas cortas. El supervisor felicita al que entrega menos defectos y regaña al que más. Los defectos vienen de las piezas, no de las personas.','El analista busca la causa en el abastecimiento y el equipo la cambia.','Una ronda más. Comparan defectos.','El supervisor solo puede cambiar el sistema; no puede hablarle a las personas.','La mayoría de los problemas son del sistema, no del esfuerzo.','¿A quién culpas de algo que es del sistema?','¿Qué problema de tu puesto viene de antes de ti?'),
 kaizen:R('Cinco rondas, cinco mejoras','Estación, piezas, papel periódico para el tablero de tiempos, cronómetro.','Equipo de 4, cada uno propone una mejora por turno.','Arman 2 cilindros y anotan el tiempo en el tablero.','Entre cada ronda, una sola mejora propuesta por una persona distinta.','Cinco rondas cortas, siempre midiendo.','Estandarizan la mejor mejora y se la enseñan a otro equipo.','Pequeñas mejoras medidas suman resultados grandes.','¿Qué mejora pequeña haría tu equipo esta semana?','¿Qué cambiarías mañana en tu puesto?'),
 phva:R('El experimento de la estación','Estación, piezas, papel con 4 cuadros (Planear, Hacer, Verificar, Actuar), cronómetro.','Equipo de 3 o 4.','Planear: escriben una hipótesis ("si cambio X, el tiempo baja"). Hacer: 3 minutos. Verificar: miden. Actuar: adoptan o descartan.','Segundo ciclo con otra hipótesis.','Comparan los dos ciclos con datos.','Tercer ciclo completo en solo 2 minutos.','Probar rápido y medir vence a opinar.','¿Qué decisión de tu empresa podrías probar en pequeño antes?','¿Qué cambio probarías una semana en tu puesto?'),
 mejora1:R('El 1% medible','Estación, piezas, cronómetro, papel.','1 ensamblador, 1 medidor.','Miden 3 veces el tiempo de una sola operación (por ejemplo, ajustar los tornillos de la tapa) y promedian.','Un solo cambio pequeño en esa operación.','3 mediciones más y nuevo promedio.','El equipo explica con datos si mejoró o fue suerte.','Medir antes y después convierte una idea en kaizen.','¿Qué mejora de tu empresa nunca se midió?','¿Qué operación tuya podrías medir hoy?'),
 estmejora:R('Que la mejora no se pierda','Estación, piezas, papel periódico, marcadores, cronómetro.','Equipo A (turno 1), equipo B (turno 2).','El equipo A encuentra una mejora en el ensamble y la aplica.','Tiene 3 minutos para dejarla en una hoja visual, sin hablar con el equipo B.','El equipo B trabaja solo con la hoja: ¿mantuvo la mejora?','Un tercer turno repite con la misma hoja.','Una mejora vale cuando otro turno la repite sin ayuda.','¿Cuántas mejoras de tu empresa se perdieron al cambiar de persona?','¿Cómo dejas tu mejora para el siguiente turno?'),
 mejoracont:R('La planta que mejora sola','Línea completa, piezas, papel periódico con tablero de producción y defectos, cronómetro.','Equipo de planta y un líder de mejora que rota.','Producen 5 minutos y anotan producción y defectos.','Reunión de pie de 2 minutos: el problema principal y una acción.','Repiten 3 ciclos, cada uno con un líder distinto.','El facilitador retira al líder: el equipo debe sostener el ciclo solo.','La mejora continua es un hábito del equipo, no de una persona.','¿Tu empresa mejora si tú no estás?','¿Qué haría tu equipo sin jefe en la reunión?'),
 caso:R('El caso en una hoja','Papel periódico, marcadores, los tiempos de un reto anterior, cronómetro.','1 presentador y el resto como público que pregunta.','En 2 minutos presentan el antes y el después de un reto: situación, problema, acción, resultado y aprendizaje.','El público señala qué parte faltó o qué dato no se mostró.','Lo presentan otra vez en 1 minuto.','Lo resumen en una sola hoja dibujada con un dato grande.','Un caso con datos convence más que una opinión.','¿Cuál es tu caso de mejora con datos?','¿Qué mejora tuya puedes mostrar con un número?'),
 metodo:R('Diseña tu reto','Equipos de la Fábrica, papel periódico, marcadores, la ficha de 8 momentos.','Equipo diseñador y equipo de prueba.','El equipo diseña un reto de 10 minutos sobre un concepto de su Banco del método.','Otro equipo lo juega y dice qué principio Praxis falta: haciendo, sin ruido, simple, divertido.','Juegan la versión mejorada.','El mejor reto se propone para los talleres de la Fábrica.','Un método se prueba haciéndolo vivir a otros.','¿Qué reto llevarías a tu empresa el lunes?','¿Qué reto le propondrías a tu equipo?')

const EXM={
 gemba:{h:"Historia modelo: el dueño de una panadería culpaba a los panaderos por la demora de las mañanas. Un día llegó antes del amanecer y solo observó. Vio que el horno se apagaba por un enchufe flojo que nadie reportaba. Lo arregló esa misma mañana: el problema no estaba en el reporte, estaba en el lugar.",j:EXJ.gemba},
 seiri:{h:"Historia modelo: un taller de motos guardaba tres cajas de repuestos \"por si acaso\". Al clasificar encontraron piezas de modelos que ya no reparaban y herramientas repetidas. Al sacarlas apareció espacio para una segunda estación de trabajo, sin comprar nada.",j:EXJ.seiri},
 digital:{h:"Historia modelo: una gerente comercial revisaba el celular a cada rato \"por si un cliente escribía\". Silenció todo menos las llamadas y revisó mensajes en horas fijas. No perdió clientes y por primera vez entregó sus propuestas a tiempo.",j:EXJ.digital},
 seiton:{h:"Historia modelo: en un restaurante cada cocinero guardaba los cuchillos donde podía, y en hora pico se gritaban preguntando dónde estaba todo. Pintaron la silueta de cada utensilio en la pared. Desde ese día, si falta uno se ve al instante y nadie pregunta.",j:EXJ.seiton},
 seiso:{h:"Historia modelo: un operario de una planta de alimentos limpiaba su máquina al final del turno. Un día vio una mancha de aceite que antes no estaba. Avisó y encontraron un empaque roto antes de que parara la línea. Limpiar es inspeccionar.",j:EXJ.seiso},
 seiketsu:{h:"Historia modelo: una ferretería ordenó su bodega en un fin de semana y al mes estaba igual que antes. La segunda vez tomaron una foto del orden ideal y la pegaron en cada estante. Desde entonces cualquiera sabe cómo debe quedar sin preguntar.",j:EXJ.seiketsu},
 s5:{h:"Historia modelo: un gimnasio aplicó 5S y a los dos meses todo había vuelto al desorden. El dueño creó una auditoría de 5 minutos cada viernes con el puntaje en una pizarra a la vista. El orden se sostuvo porque se medía y se veía.",j:EXJ.s5},
 espera:{h:"Historia modelo: un food truck tenía filas largas los viernes. El dueño observó que la espera no estaba en la cocina sino en cobrar: buscaban cambio en cada pedido. Pusieron pago con QR y monedas listas. La fila avanzó sin cocinar más rápido.",j:EXJ.espera},
 sobreprod:{h:"Historia modelo: un emprendedor tenía cinco proyectos abiertos y ninguno terminado. Los escribió en una hoja, eligió uno y archivó los demás con fecha para revisarlos en 30 días. En ese mes terminó el primero; dos de los archivados ya no le interesaban.",j:EXJ.sobreprod},
 inventario:{h:"Historia modelo: una tienda de ropa compró mucha mercancía de temporada porque estaba barata. Al final de la temporada seguía en la bodega, ocupando espacio y dinero. El dueño aprendió a comprar menos y más seguido. Lo mismo pasa con los cursos que compras y no aplicas.",j:EXJ.inventario},
 movimiento:{h:"Historia modelo: en una cocina la nevera estaba al otro extremo de la estufa. Un cocinero contó cuántas veces cruzaba en un servicio y se sorprendió. Pusieron una nevera pequeña junto a la estufa. El servicio fue más rápido sin que nadie trabajara más.",j:EXJ.movimiento},
 retrabajo:{h:"Historia modelo: una imprenta repetía pedidos por errores de ortografía. En lugar de regañar al diseñador preguntaron por qué cinco veces. La causa raíz: el cliente aprobaba por chat sin ver la versión final. Crearon una aprobación sobre la prueba final y el retrabajo bajó.",j:EXJ.retrabajo},
 sobreproc:{h:"Historia modelo: un consultor pasaba dos semanas puliendo cada propuesta. Probó enviar una sola página clara en un día y ajustarla con el cliente. Cerró más rápido: el cliente quería claridad, no perfección.",j:EXJ.sobreproc},
 talento:{h:"Historia modelo: en un restaurante una mesera proponía ideas que nadie escuchaba. El nuevo administrador abrió 10 minutos semanales para escuchar al equipo. Una idea de ella para reorganizar las mesas mejoró la atención de los fines de semana.",j:EXJ.talento},
 toc:{h:"Historia modelo: una fábrica de muebles compró una segunda sierra para producir más, y la producción no subió. Al mirar el flujo, el cuello de botella era la cabina de pintura. Todo lo que mejoraron antes de pintar solo acumuló muebles esperando.",j:EXJ.toc},
 estandar:{h:"Historia modelo: en una heladería cada empleado servía las porciones a su manera; unos clientes recibían más y otros menos. Escribieron la receta con fotos y una cuchara de medida. Las quejas bajaron y el empleado nuevo aprendió en un día.",j:EXJ.estandar},
 pokayoke:{h:"Historia modelo: en un lavadero de carros a veces olvidaban el tapete de atrás. Pusieron un gancho para cada tapete al sacarlo: si queda un gancho vacío, el carro no se entrega. El olvido se volvió imposible.",j:EXJ.pokayoke},
 andon:{h:"Historia modelo: en una pizzería el cocinero veía que la masa salía mal, pero seguía para no atrasar pedidos, y los clientes devolvían pizzas. El dueño puso una campana: quien vea un problema la suena y el equipo para un minuto a resolverlo. Parar a tiempo salió más barato.",j:EXJ.andon},
 estandar2:{h:"Historia modelo: una empacadora tenía su procedimiento escrito, pero en temporada alta todos lo saltaban para ir más rápido. Los errores subieron justo cuando más importaba. El jefe no exigió más velocidad: ajustó el estándar con el equipo para que funcionara con afán. Un estándar que no aguanta la presión no es estándar.",j:EXJ.estandar2},
 subordinar:{h:"Aníbal decidió atacar Roma cruzando los Alpes, por donde sus enemigos no lo esperaban. Su ejército, su logística y sus tiempos se organizaron alrededor de esa decisión. No buscó ganar en todos los frentes: subordinó todo a una sola jugada.",j:EXJ.subordinar},
 sistema:{h:"Deming hacía el experimento de las cuentas rojas: unos \"trabajadores\" sacaban cuentas de una caja con una paleta y eran premiados o regañados según cuántas rojas salían. El resultado dependía del sistema, no del esfuerzo. Culpar a la persona no cambia el sistema.",j:EXJ.sistema},
 kaizen:{h:"Historia modelo: una tienda de barrio tardaba en cerrar caja cada noche. Cada semana el dueño probó una sola mejora: billetes ordenados por valor, un formato fijo, la calculadora junto a la caja. Ninguna era grande. Juntas cambiaron su noche.",j:EXJ.kaizen},
 phva:{h:"Historia modelo: un restaurante quería entregar más rápido. En vez de cambiar todo, probó un solo cambio en el almuerzo durante una semana, midió y comparó. Funcionó y lo volvió estándar. Lo que no funcionó lo descartó sin drama.",j:EXJ.phva},
 mejora1:{h:"Historia modelo: un vendedor quería cerrar más. En vez de comprar otro curso, cambió una sola frase al final de cada reunión y anotó qué pasaba. A las semanas tenía datos de qué funcionaba. Una mejora pequeña y medida le enseñó más que diez ideas sueltas.",j:EXJ.mejora1},
 estmejora:{h:"Historia modelo: un mecánico descubrió una forma más rápida de cambiar frenos, pero sus compañeros seguían a la antigua porque nadie la escribió. Cuando la grabó y la pegó en la estación, todo el taller subió de nivel. Una mejora que no se estandariza se pierde.",j:EXJ.estmejora},
 mejoracont:{h:"Historia modelo: una panadería mejoró su horario de horneado y se quedó tranquila. Un tiempo después la competencia la superó. Retomaron una mejora pequeña por semana. La mejora continua no es un proyecto: es una costumbre.",j:EXJ.mejoracont},
 caso:{h:"Estructura que funciona: situación, problema, acción, resultado y aprendizaje. Modelo: \"Mi mañana se perdía en el celular. No avanzaba en Praxis. Saqué el celular del cuarto. Terminé mi bloque completo. El entorno vence a la voluntad.\" Cambia cada parte por tus datos reales.",j:EXJ.caso},
 metodo:{h:"Historia modelo: un entrenador de fútbol juvenil no tenía un libro; tenía 4 ejercicios que repetía y mejoraba cada temporada. Con los años, esos ejercicios fueron su método. Un método no se escribe primero: se vive, se repite y luego se escribe.",j:EXJ.metodo}

const CASES=[
 C_(0,'¿Local o prueba?','Eric Ries, El método Lean Startup (2011)','Nick Swinmurn, fundador de Zappos, validó si la gente compraría zapatos por internet tomando fotos de zapatos en tiendas y publicándolas. Cuando alguien compraba, iba a la tienda y lo compraba él mismo. Probó la demanda antes de invertir en inventario.','Salomón quiere abrir una tienda de café de especialidad. Encontró un local precioso y el dueño le pide firmar hoy un contrato de un año.',['Ahorros: COP 30 millones','Arriendo: COP 4 millones al mes, contrato de 12 meses','Ventas reales hasta hoy: cero'],'¿Qué hace Salomón esta semana?',[O('Prueba 4 fines de semana con un carrito en ferias y oficinas, y mide cuánto vende antes de firmar',1,'Vendió 3 de 4 fines de semana y aprendió qué bebidas piden. Firma después, con datos y mejor negociación.'),O('Firma hoy: el local es perfecto y alguien más lo puede tomar',0.15,'Abrió con la mitad de los ahorros comprometidos y sin saber si el sitio vende. Cada mes de arriendo pesa.'),O('Hace una encuesta en redes a sus amigos preguntando si irían',0.55,'Todos dijeron que sí. Las opiniones no son ventas: sigue sin saber si el negocio funciona.')],'Valida con ventas reales, en pequeño, antes de invertir en grande.','experimento'),
 C_(0,'Todos dicen que les encanta','Rob Fitzpatrick, The Mom Test (2013)','Fitzpatrick muestra que preguntar "¿comprarías esto?" produce mentiras amables. Propone preguntar por lo que la persona ya hizo: cuándo fue la última vez, cuánto pagó, qué le molestó.','En las ferias, todos prueban el café y dicen que es delicioso y que irían a la tienda.',['Personas que probaron: 120','Personas que compraron una segunda vez: 9'],'¿Qué le pregunta Salomón a los clientes?',[O('¿Cuándo fue la última vez que compraste un café de especialidad, dónde y cuánto pagaste?',1,'Descubre que sus clientes reales son oficinistas que compran a las 7 a.m. y pagan más por rapidez. Ajusta la oferta.'),O('¿Te gustó? ¿Vendrías a mi tienda?',0.15,'Recibe más elogios y ningún dato útil. Abre pensando en un cliente que no existe.'),O('Regala más muestras para que lo conozca más gente',0.55,'Más gente lo prueba, pero sigue sin saber quién paga y por qué.')],'Pregunta por hechos del pasado, no por opiniones sobre el futuro.','gemba'),
 C_(0,'¿Barato o experiencia?','Howard Schultz, Pour Your Heart Into It (1997)','En un viaje a Milán en 1983, Schultz vio que los bares de espresso eran lugares de encuentro, no solo puntos de venta de café. De esa idea nació la propuesta de experiencia de Starbucks.','La tienda abrió. A una cuadra hay una cadena que vende el tinto mucho más barato.',['Precio de Salomón: COP 7.000 el latte','Precio de la cadena: COP 4.500','Costo variable del latte de Salomón: COP 2.600 (cifras de la historia)'],'¿Cómo compite Salomón?',[O('Mantiene precio y diseña la experiencia: barista que cuenta el origen, espacio para quedarse y atención por nombre',1,'Los clientes que se quedan vuelven y traen a otros. El margen le permite pagar bien al equipo.'),O('Baja a COP 4.500 para igualar a la cadena',0.15,'Vende más tazas pero casi no gana. Una cadena siempre aguanta más una guerra de precios.'),O('Pone promociones 2x1 todos los días',0.55,'Llena la tienda de cazadores de descuentos que no vuelven sin promoción.')],'No compitas por precio contra quien es más grande: compite por valor.','unacosa'),
 C_(0,'El socio con plata','Noam Wasserman, The Founder\'s Dilemmas (2012)','Wasserman estudió miles de empresas nuevas y documentó que los conflictos entre fundadores, por roles, dinero o control, son una de las causas principales de su fracaso.','Un amigo le ofrece COP 40 millones para abrir otra tienda a cambio del 50% de la empresa. Es buen amigo, pero nunca han trabajado juntos.',['Valor que Salomón le da hoy a su empresa: sin valoración formal','Necesidad de capital: COP 40 millones'],'¿Qué hace Salomón?',[O('Antes de aceptar, firma un acuerdo de socios: roles, aportes, decisiones, salida y valores compartidos',1,'La conversación difícil se dio al principio. El socio aporta y cada uno sabe qué decide.'),O('Acepta 50/50 de palabra: es su amigo',0.15,'A los meses no están de acuerdo en nada y nadie puede decidir. La amistad y la empresa sufren.'),O('Recibe el dinero como préstamo informal sin papeles',0.55,'Tiene el dinero, pero no hay plazos ni condiciones claras. La relación queda en riesgo.')],'Uno no se asocia con el dinero ni con los contactos: se asocia con la persona y sus valores.',null),
 C_(0,'Vendo, pero no hay plata','Phil Knight, Shoe Dog (2016)','Las ventas de Blue Ribbon, la empresa que luego se convirtió en Nike, crecían cada año, pero todo el efectivo se iba en inventario. El banco le cerró el crédito y la empresa estuvo a punto de quebrar mientras crecía.','Las dos tiendas venden bien, pero a fin de mes no alcanza para la nómina.',['Ventas: COP 45 millones al mes','Proveedores: pago de contado','Inventario en bodega: café para 2 meses (cifras de la historia)'],'¿Qué hace Salomón?',[O('Arma un flujo de caja semanal, negocia 30 días con proveedores y baja el inventario a 2 semanas',1,'Libera caja sin vender una taza más. Ahora ve venir los meses difíciles.'),O('Pide un préstamo gota a gota para la nómina',0.15,'Paga la nómina, pero los intereses diarios se comen el margen. El problema vuelve más grande.'),O('Sube los precios 30% de golpe',0.55,'Entra más dinero por taza, pero se van clientes. El inventario sigue amarrando la caja.')],'Crecer consume caja. Vigila el efectivo, no solo las ventas.','muda'),
 C_(0,'La fila de las 7 a.m.','Película The Founder (2016)','Los hermanos McDonald dibujaron con tiza su cocina en una cancha de tenis y ensayaron con los empleados cada movimiento hasta lograr un sistema de servicio rápido.','Entre 7 y 9 a.m. la fila tarda 15 minutos. Varios clientes miran la fila y se van.',['Clientes perdidos estimados: 20 por mañana','Pasos del barista por bebida: muchos cruces detrás de la barra (cifras de la historia)'],'¿Qué hace Salomón?',[O('Observa la barra en hora pico, dibuja el flujo en el piso y ensaya con el equipo un nuevo orden',1,'Elimina cruces y esperas. La fila baja a la mitad con el mismo equipo.'),O('Contrata dos baristas más',0.55,'La fila baja un poco, pero ahora chocan entre ellos y el costo sube.'),O('Pone un televisor para entretener a la fila',0.15,'La fila sigue igual. Solo entretuvo el problema.')],'Ve al lugar, observa el flujo y rediséñalo antes de agregar recursos.','gemba'),
 C_(0,'El café ya no sabe igual','Howard Schultz, Onward (2011)','En 2008, Starbucks cerró temporalmente sus tiendas de Estados Unidos durante unas horas para volver a entrenar a sus baristas en la preparación del espresso. Schultz sentía que el crecimiento había diluido la experiencia.','Con la tercera tienda llegaron las quejas: "el café ya no sabe como antes". Cada barista prepara a su manera.',['Quejas: subieron fuerte en el último mes','Baristas nuevos: 5 en 3 meses (cifras de la historia)'],'¿Qué hace Salomón?',[O('Cierra medio día, define la receta estándar con medidas y entrena a todos con ella',1,'El sabor vuelve a ser constante. Los nuevos aprenden en días, no en meses.'),O('Despide al barista que más quejas tiene',0.15,'Las quejas siguen: el problema era el sistema, no una persona.'),O('Cambia a un café más barato para compensar las quejas con mejor precio',0.15,'Pierde lo que lo hacía diferente.')],'Sin estándar no hay calidad constante ni mejora.','estandar'),
 C_(1,'¿Tostar o comprar tostado?','James Freeman, Blue Bottle Coffee','Blue Bottle nació con la promesa de vender café a pocas horas de tostado: la frescura era su diferencia. Tostar le daba control sobre la calidad.','El proveedor de café tostado entrega lotes distintos cada semana. Salomón piensa en montar su propia tostadora.',['Tostadora grande nueva: COP 180 millones','Maquila de tueste por horas: disponible en la ciudad','Consumo actual: 300 kg al mes (cifras de la historia)'],'¿Qué decide?',[O('Hace un piloto de 3 meses alquilando tueste por horas: mide costo, calidad y demanda antes de comprar',1,'Aprende a tostar, confirma el ahorro y compra después la máquina del tamaño correcto.'),O('Compra la tostadora grande con un crédito a 5 años',0.15,'Queda con una máquina enorme, mucha deuda y poco volumen para llenarla.'),O('Sigue con el proveedor y le pide que mejore',0.55,'Mejora un poco, pero sigue sin control sobre su producto principal.')],'Prueba en pequeño antes de invertir en capacidad.','experimento'),
 C_(1,'El cuello de botella','Eliyahu Goldratt, La meta (1984)','En la novela, el gerente Alex Rogo lleva a un grupo de exploradores de caminata. El grupo solo avanza al ritmo del más lento, Herbie. Así entiende que su planta produce al ritmo de su cuello de botella.','La planta tuesta, enfría, muele y empaca. Los pedidos se atrasan y todos están ocupados.',['Tueste: 60 kg por hora','Enfriado: 60 kg por hora','Empaque manual: 35 kg por hora (cifras de la historia)'],'¿Dónde actúa Salomón?',[O('Mide cada etapa, confirma que el empaque es la restricción y lo mejora primero: nunca debe parar',1,'La producción sube sin comprar otra tostadora.'),O('Compra una segunda tostadora',0.15,'Tuesta más, pero el café se acumula frente al empaque. Más inventario, mismos pedidos.'),O('Pone horas extra a toda la planta',0.55,'Sale algo más, a un costo alto. El cuello sigue igual.')],'El sistema produce al ritmo de su restricción: mejora ahí primero.','toc'),
 C_(1,'Lotes quemados','W. Edwards Deming, Out of the Crisis (1982)','Uno de los 14 puntos de Deming dice que hay que dejar de depender de la inspección masiva para lograr calidad y construirla en el proceso.','Algunos lotes salen quemados y se descubren al final, al empacar.',['Lotes defectuosos: 8% (cifras de la historia)','Costo de cada lote perdido: alto'],'¿Qué hace Salomón?',[O('Define un perfil de tueste estándar, registra cada lote y busca la causa raíz con 5 porqués',1,'Encuentra que la temperatura inicial varía. Corrige la causa y los defectos caen.'),O('Contrata un inspector que revise todo al final',0.55,'Separa los malos, pero se siguen produciendo. La inspección no mejora el proceso.'),O('Vende los lotes quemados más baratos',0.15,'Recupera algo de dinero y daña la marca.')],'La calidad se construye en el proceso, no se inspecciona al final.','porques'),
 C_(1,'La máquina se para','Seiichi Nakajima, Introducción al TPM (1988)','Nakajima desarrolló el Mantenimiento Productivo Total (TPM), en el que los operarios cuidan a diario su equipo para prevenir fallas, en lugar de esperar a que se dañe.','La tostadora se detiene casi cada semana y se pierden pedidos.',['Paradas: 1 por semana','Tiempo promedio de reparación: medio día (cifras de la historia)'],'¿Qué hace Salomón?',[O('Crea una rutina diaria de limpieza, inspección y lubricación por el operario, más mantenimiento preventivo',1,'Las paradas bajan. El operario detecta los problemas antes de que paren la máquina.'),O('Llama al técnico cada vez que falle',0.15,'Sigue apagando incendios y perdiendo pedidos.'),O('Compra una máquina nueva',0.55,'Funciona por un tiempo, pero sin rutina la nueva también empieza a fallar.')],'Cuida el equipo todos los días: prevenir es más barato que reparar.','seiso'),
 C_(1,'La bodega de sacos','Hiroyuki Hirano, 5 Pillars of the Visual Workplace (1995)','Hirano popularizó las 5S como base visual de cualquier planta: si el lugar está ordenado, los problemas se ven.','En la bodega hay sacos de café verde sin fecha, algunos viejos, y nadie sabe qué hay.',['Sacos sin identificar: muchos','Café que se pasó de fecha el mes pasado: varios sacos (cifras de la historia)'],'¿Qué hace Salomón?',[O('Aplica 5S en la bodega: clasifica, ordena con fecha y ubicación, y usa primero en entrar, primero en salir',1,'Encuentra café olvidado, deja de perderlo y cualquiera encuentra un saco en segundos.'),O('Alquila una bodega más grande',0.15,'Más espacio para el mismo desorden.'),O('Cuenta el inventario completo cada mes',0.55,'Sabe cuánto hay, pero sigue perdiendo café entre conteos.')],'Ordena primero: un lugar visible muestra los problemas.','s5'),
 C_(1,'Se van los operarios','Daniel Pink, La sorprendente verdad sobre qué nos motiva (2009)','Pink recoge investigaciones según las cuales, en trabajos que exigen pensar, la motivación se sostiene más con autonomía, maestría y propósito que con premios y castigos.','Los operarios de la planta renuncian a los pocos meses. Entrenar a cada nuevo cuesta tiempo y calidad.',['Rotación: alta','Salario: en el promedio del mercado (cifras de la historia)'],'¿Qué hace Salomón?',[O('Da autonomía en el puesto, una ruta para volverse catador o maestro tostador, y conecta al equipo con las fincas',1,'La rotación baja. Los operarios proponen mejoras porque el trabajo es suyo.'),O('Paga un bono por kilos producidos',0.55,'Producen más, pero baja la calidad y siguen sin sentirse parte.'),O('Pone más supervisión',0.15,'El ambiente empeora y se van más rápido.')],'La gente se queda donde crece y entiende para qué trabaja.','kaizen'),
 C_(2,'¿A quién le vendo?','Juan Valdez, Federación Nacional de Cafeteros','A finales de los años cincuenta, la Federación Nacional de Cafeteros creó el personaje de Juan Valdez para que el mundo reconociera el café de Colombia por su origen, no como un grano genérico.','Salomón quiere vender café empacado. Hay tres caminos: supermercados, tiendas especializadas u oficinas.',['Supermercados: piden descuentos y pagos de exhibición','Oficinas: compran cada mes','Capacidad de su equipo comercial: 1 persona (cifras de la historia)'],'¿Por dónde empieza?',[O('Domina un solo canal: oficinas con suscripción mensual, café fresco y servicio',1,'Ingresos recurrentes y clientes fieles. Con esa base, puede abrir otro canal.'),O('Entra a todos los supermercados que pueda',0.15,'Paga exhibición, vende poco y no tiene equipo para atenderlos.'),O('Vende por redes sociales sin un plan',0.55,'Vende algo, pero sin foco ni crecimiento.')],'Domina un canal antes de abrir otro.','unacosa'),
 C_(2,'Me pagan a 90 días','Ley 2024 de 2020 de Colombia (pago en plazos justos)','En Colombia, la Ley 2024 de 2020 fijó plazos máximos para pagar facturas a las micro, pequeñas y medianas empresas: primero 60 días y después 45 días calendario.','Una cadena grande quiere comprarle, pero paga a 90 días.',['Pedido mensual: COP 60 millones','Caja de Salomón: alcanza para unas 6 semanas (cifras de la historia)'],'¿Qué hace?',[O('Negocia con la ley a la mano, factura electrónicamente y usa factoring si hace falta. Pone un cupo de cartera por cliente',1,'Cobra en el plazo legal y no financia a un gigante con su caja.'),O('Acepta 90 días: es un cliente grande',0.15,'A los dos meses no tiene caja para comprar café verde.'),O('Rechaza al cliente',0.55,'Protege la caja, pero pierde una oportunidad que se podía negociar.')],'Conoce tus derechos y protege tu caja: vender sin cobrar no es vender.',null),
 C_(2,'Presentaciones que no rotan','Caso de Harvard Business School "ZARA: Fast Fashion" (2003)','Zara produce en lotes pequeños, cerca de la demanda real, y retira rápido lo que no se vende. Así evita inventarios grandes de productos que nadie quiere.','Salomón tiene 6 presentaciones de café empacado. Dos casi no se venden.',['Presentaciones: 6','2 presentaciones: casi la mitad del inventario y menos del 10% de las ventas (cifras de la historia)'],'¿Qué hace?',[O('Mide la rotación de cada presentación, elimina las que no rotan y produce en lotes pequeños según pedido',1,'Libera caja y bodega. Se enfoca en lo que el cliente compra.'),O('Produce más de todo para nunca quedarse sin producto',0.15,'La bodega se llena y el café envejece.'),O('Hace 2x1 permanente de las que no rotan',0.55,'Se venden, pero sin margen y acostumbrando al cliente al descuento.')],'Produce lo que el cliente jala, no lo que tú empujas.','muda'),
 C_(2,'Quieren 25% de descuento','Warren Buffett, entrevista con la comisión FCIC de Estados Unidos (2011)','Buffett dijo que la decisión más importante al evaluar un negocio es su poder de fijar precios: poder subirlos sin perder clientes.','Un cliente grande pide 25% de descuento o se va con la competencia.',['Margen bruto del café empacado: 38%','Este cliente: 20% de las ventas del canal (cifras de la historia)'],'¿Qué responde Salomón?',[O('Calcula su margen real y ofrece más valor (frescura, servicio, entregas) o descuentos por escala de volumen, no un descuento plano',1,'El cliente se queda con un acuerdo por volumen. El margen se protege.'),O('Acepta el 25%',0.15,'Con ese descuento el cliente casi no deja ganancia y los demás pedirán lo mismo.'),O('Dice que no sin negociar',0.55,'Protege el precio, pero pierde la oportunidad de crear valor juntos.')],'Defiende el precio con valor; el descuento es la última herramienta.',null),
 C_(2,'El camión medio vacío','Southwest Airlines, años setenta','A comienzos de los setenta, Southwest tuvo que vender uno de sus cuatro aviones. Para cumplir sus rutas logró preparar los aviones en tierra en unos diez minutos. Ese uso intenso de sus activos se volvió su ventaja.','El camión de reparto sale medio vacío a entregar donde cada cliente llama.',['Viajes por semana: muchos, sin ruta fija','Carga promedio: menos de la mitad (cifras de la historia)'],'¿Qué hace Salomón?',[O('Diseña rutas fijas por zona y día, con pedidos programados y el camión lleno',1,'Menos viajes, menos costo y entregas a tiempo.'),O('Compra un segundo camión',0.15,'Dos camiones medio vacíos.'),O('Contrata una mensajería para todo',0.55,'Resuelve la logística pero el costo por entrega sube.')],'Usa al máximo lo que ya tienes antes de comprar más.','estandar'),
 C_(2,'La cultura se diluye','Tony Hsieh, Delivering Happiness (2010)','En Zappos, al terminar la capacitación de los nuevos empleados se les ofrecía dinero para renunciar si sentían que no encajaban con la cultura. Hsieh quería que se quedara solo quien de verdad la compartía.','La empresa contrató a 40 personas en un año. Los antiguos dicen que "ya no se siente igual".',['Empleados: 70','Valores escritos: ninguno (cifras de la historia)'],'¿Qué hace Salomón?',[O('Escribe los valores con el equipo, contrata y evalúa por valores y crea una inducción fuerte',1,'Los nuevos entienden cómo se trabaja. La cultura escala con la empresa.'),O('Contrata al primero disponible para no frenar',0.15,'Crece la empresa y se pierde lo que la hacía especial.'),O('Deja que cada jefe decida a su manera',0.55,'Cada área se vuelve una empresa distinta.')],'La cultura no se hereda sola: se define, se contrata y se cuida.','talento'),
 C_(2,'Quince reportes que nadie lee','Andy Grove, High Output Management (1983)','Grove, director de Intel, impulsó medir resultados concretos con pocos objetivos y resultados clave. John Doerr llevó ese sistema a otras empresas y lo contó en Mide lo que importa (2018).','Cada área manda reportes distintos. Nadie sabe si la empresa va bien.',['Reportes semanales: 15','Indicadores que el gerente revisa: ninguno fijo (cifras de la historia)'],'¿Qué hace Salomón?',[O('Escoge 5 indicadores clave (ventas, margen, entregas a tiempo, rotación, satisfacción) en un tablero semanal visible',1,'Las reuniones se acortan y las decisiones se toman con datos.'),O('Pide reportes más completos',0.15,'Más ruido, menos decisiones.'),O('Decide por intuición, como siempre',0.55,'A veces acierta, pero no sabe por qué.')],'Pocos datos que importan valen más que muchos que nadie usa.','phva'),
 C_(3,'Una marca con origen','Juan Valdez Café, Procafecol (2002)','En 2002 la Federación Nacional de Cafeteros abrió las tiendas Juan Valdez Café para vender el café colombiano como experiencia y marca, no solo como grano exportado.','Salomón quiere que su café sea una marca nacional reconocida, como las que admira.',['Tiendas: 25','Reconocimiento de marca fuera de su ciudad: bajo (cifras de la historia)'],'¿Cómo construye la marca?',[O('Cuenta la historia real del origen: fincas, productores y trazabilidad de cada bolsa, con experiencia constante en cada tienda',1,'La marca tiene algo que nadie puede copiar: su origen y su gente.'),O('Invierte todo en publicidad y descuentos de lanzamiento',0.55,'Lo conocen más, pero no saben por qué es distinto.'),O('Copia el estilo de una cadena extranjera',0.15,'Se ve como una imitación.')],'Una marca fuerte cuenta una verdad que nadie más puede contar.',null),
 C_(3,'¿Franquiciar?','Película The Founder (2016) y la historia de McDonald\'s','Harry Sonneborn, asesor financiero de Ray Kroc, propuso que McDonald\'s controlara los terrenos donde operaban los franquiciados. Así la empresa ganaba estabilidad y control sobre la calidad.','Veinte inversionistas quieren franquicias de la marca.',['Tiendas propias: 35','Manual de operación: incompleto (cifras de la historia)'],'¿Qué decide?',[O('Hace un piloto de 3 franquicias con manual completo, estándar, auditoría y control de los locales',1,'Aprende qué funciona antes de crecer y protege la calidad de la marca.'),O('Vende las 20 franquicias de una vez',0.15,'Entra mucho dinero y cada tienda hace lo que quiere. La marca se daña.'),O('Rechaza toda expansión',0.55,'Protege la calidad, pero deja el mercado a otros.')],'Escala solo lo que ya está estandarizado.','estandar'),
 C_(4,'El primer contrato en dólares','Banco de la República de Colombia: tasa de cambio y coberturas','Los exportadores colombianos cobran en dólares y pagan sus costos en pesos. Las variaciones de la tasa de cambio pueden borrar el margen; por eso existen coberturas como los contratos forward.','Un importador extranjero quiere un contrato de 6 meses, pagado en dólares.',['Valor del contrato: USD 400.000','Margen esperado: 12% (cifras de la historia)'],'¿Qué hace Salomón?',[O('Cubre parte del contrato con un forward y deja una cláusula de ajuste de precio',1,'Si el dólar cae, el margen se protege. Duerme tranquilo.'),O('Apuesta a que el dólar va a subir',0.15,'El dólar bajó y el margen desapareció.'),O('Exige que le paguen en pesos',0.55,'Evita el riesgo, pero el importador busca otro proveedor.')],'No apuestes con lo que no controlas: protégete.',null),
 C_(4,'Abrir en otro país','Starbucks en Australia (2000-2008)','Starbucks entró a Australia en 2000. En 2008 cerró la mayoría de sus tiendas allí: el país ya tenía una cultura de café fuerte y la cadena no se adaptó a ella.','Salomón quiere abrir 10 tiendas en un país con fuerte cultura de café.',['Inversión por tienda: alta','Conocimiento del mercado: poco (cifras de la historia)'],'¿Cómo entra?',[O('Entra con un socio local y un piloto de 2 tiendas adaptadas al gusto del país',1,'Aprende rápido y ajusta antes de invertir en grande.'),O('Abre las 10 tiendas copiando el modelo de Colombia',0.15,'El público local no conecta y cierra varias tiendas.'),O('Solo vende en línea a ese país',0.55,'Riesgo bajo, pero también poca presencia de marca.')],'Lo que funciona en casa no siempre funciona afuera: prueba y adapta.','experimento'),
 C_(4,'La amenaza nueva','Marc Randolph, That Will Never Work (2019)','En el año 2000, los fundadores de Netflix le ofrecieron a Blockbuster venderle la empresa por USD 50 millones. Blockbuster no aceptó. Años después Netflix creció y Blockbuster quebró.','Crecen las cápsulas, el café a domicilio y las suscripciones en línea. Las ventas en tienda se estancan.',['Ventas en tienda: estables','Ventas en línea de la competencia: crecen rápido (cifras de la historia)'],'¿Qué hace Salomón?',[O('Crea un equipo pequeño que pruebe el nuevo modelo, aunque compita con sus propias tiendas',1,'Se adelanta al cambio en vez de sufrirlo.'),O('Lo ignora: su negocio son las tiendas',0.15,'Cuando reacciona, otros ya se quedaron con los clientes.'),O('Baja los precios en tienda para competir',0.55,'Gana tiempo, pierde margen.')],'Si no te cambias tú, el mercado te cambia.','kaizen'),
 C_(4,'Crisis de un lote','Johnson & Johnson, caso Tylenol (1982)','En 1982 varias personas murieron en Chicago tras tomar cápsulas de Tylenol adulteradas. Johnson & Johnson retiró del mercado unos 31 millones de frascos y puso la seguridad del consumidor primero. La marca se recuperó.','Clientes reportan un sabor extraño en un lote de café empacado. Aún no se sabe la causa.',['Bolsas en el mercado de ese lote: 12.000 (cifras de la historia)'],'¿Qué hace Salomón?',[O('Retira el lote, comunica con transparencia y usa la trazabilidad para encontrar la causa',1,'Pierde dinero esta semana y gana confianza para años.'),O('Espera en silencio a confirmar la causa',0.15,'La noticia sale por redes antes que él. La confianza cae.'),O('Niega el problema',0.15,'Se vuelve una crisis de reputación.')],'En una crisis, la confianza vale más que el lote.','andon'),
 C_(4,'Origen justo','Yvon Chouinard, Que mi gente vaya a surfear (2005)','Chouinard, fundador de Patagonia, convirtió la responsabilidad con el planeta y con su gente en el centro de la estrategia. En 2022 transfirió la propiedad de la empresa a un fideicomiso y a una organización ambiental.','Los clientes internacionales piden saber de dónde viene el café y si al productor le pagan bien.',['Compras de café verde: a intermediarios','Precio pagado al productor: no lo conoce (cifras de la historia)'],'¿Qué hace Salomón?',[O('Compra directo a fincas, paga prima por calidad y muestra la trazabilidad en cada bolsa',1,'Asegura calidad, gana clientes exigentes y fortalece a los productores.'),O('Sigue comprando al más barato',0.15,'Pierde a los clientes que pagan más.'),O('Compra un sello sin cambiar nada',0.55,'Tiene el sello, pero la historia no resiste preguntas.')],'La cadena de valor también es tu marca.',null),
 C_(4,'Tentación del imperio','Jim Collins, Good to Great (2001) y Built to Last (1994)','Collins encontró que las grandes empresas se enfocan en aquello en lo que pueden ser las mejores (el concepto del erizo) y construyen instituciones que no dependen de su fundador: "construir un reloj, no dar la hora".','La empresa está en varios países. Le proponen entrar a hoteles, licores y turismo.',['Negocio de café: rentable y creciendo','Nuevos negocios propuestos: 3 (cifras de la historia)'],'¿Qué hace Salomón?',[O('Se enfoca en ser el mejor en café y forma líderes que puedan dirigir sin él',1,'La empresa crece sin depender de él. El legado queda.'),O('Entra a los 3 negocios a la vez',0.15,'Se dispersa, como antes. El café pierde calidad.'),O('Vende la empresa ya',0.55,'Gana dinero, pero el imperio se queda en la mitad.')],'El imperio se construye con una sola cosa hecha excelente y con líderes que la sostengan.','unacosa')
];
