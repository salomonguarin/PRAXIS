<meta charset="utf-8">
<title>Forja Praxis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: una columna amplia; Hoy = 3 sesiones grandes; cada sesion = un paso por pantalla */
:root{
 --bg:#f5f3f0;--card:#ffffff;--line:#e4dfda;--tx:#1d1a18;--mut:#6b6460;--ac:#b5432c;--acs:#f6e3dd;--ok:#3f8a4f;--oks:#e1efe3;--warn:#a87a0c;--field:#fbfaf9;--on-ac:#ffffff;
 --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--body:'Inter',system-ui,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141211;--card:#1e1b1a;--line:#322e2b;--tx:#f3f0ed;--mut:#a69d98;--ac:#e0705a;--acs:#3a231d;--ok:#76b77a;--oks:#1e3122;--warn:#d9a441;--field:#100f0e;--on-ac:#ffffff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141211;--card:#1e1b1a;--line:#322e2b;--tx:#f3f0ed;--mut:#a69d98;--ac:#e0705a;--acs:#3a231d;--ok:#76b77a;--oks:#1e3122;--warn:#d9a441;--field:#100f0e;--on-ac:#ffffff;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--tx);font:18px/1.55 var(--body);max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(110px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,.k,.big{font-family:var(--display);letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:44px;line-height:1}h2{font-size:30px;line-height:1.1}h3{font-size:24px;line-height:1.15}
.mut{color:var(--mut);font-size:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.eyebrow{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:600}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac);color:var(--on-ac);border:0;border-radius:12px;padding:16px 20px;font-weight:600;font-size:18px;width:100%}
.btn2{background:none;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:14px 18px;font-size:17px}
.btn:focus-visible,.btn2:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
input[type=text],input[type=number],textarea{width:100%;background:var(--field);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:14px;font:inherit;font-size:18px}
textarea{min-height:110px;resize:vertical}
label.fl{display:block;font-weight:600;margin-bottom:6px}
.hero{display:flex;align-items:center;gap:16px;justify-content:space-between;padding-top:8px}
.ring{width:84px;height:84px;flex:none}
.ring circle{fill:none;stroke-width:9}.ring .bgc{stroke:var(--line)}.ring .fgc{stroke:var(--ac);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring text{font:700 22px var(--display);fill:var(--tx)}
.quote{font-size:20px;font-style:italic;border-left:4px solid var(--ac);padding:4px 0 4px 14px}
.tile{display:flex;gap:16px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;color:var(--tx);width:100%}
.tile .num{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:700 26px var(--display);background:var(--acs);color:var(--ac);flex:none}
.tile.done .num{background:var(--ok);color:var(--on-ac)}
.tile .tx{flex:1;min-width:0}
.tile .go{font-size:28px;color:var(--mut)}
.pill{display:inline-block;padding:3px 12px;border-radius:99px;font-size:14px;font-weight:600;background:var(--acs);color:var(--ac)}
.pill.ok{background:var(--oks);color:var(--ok)}.pill.nt{background:none;border:1px solid var(--line);color:var(--mut)}
.dots{display:flex;gap:8px}.dots i{height:6px;flex:1;border-radius:3px;background:var(--line)}.dots i.on{background:var(--ac)}
ol.do{margin:0;padding-left:26px;display:flex;flex-direction:column;gap:10px;font-size:19px}
ol.do li::marker{font-weight:700;color:var(--ac)}
.why{background:var(--acs);border-radius:12px;padding:14px 16px;font-size:16px}
.why b{color:var(--ac)}
.scale{display:flex;gap:8px}.scale button{flex:1;padding:14px 0;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--tx);font:700 22px var(--display)}
.scale button.on{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{border:1px solid var(--line);background:var(--field);color:var(--tx);border-radius:99px;padding:8px 14px;font-size:16px}
.chips button.on{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.chk{display:flex;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--field);font-size:18px}
.chk input{width:26px;height:26px;accent-color:var(--ac);flex:none}
.actions{display:flex;gap:10px}.actions .btn2{flex:0 0 auto}
.timer{font:700 64px var(--display);text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stats>div{min-width:0}
.k{font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.heat button{aspect-ratio:1;max-width:100%;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--tx);font:600 16px var(--body);font-variant-numeric:tabular-nums}
.heat .l1{background:var(--acs)}.heat .l2{background:var(--warn);color:var(--on-ac);border-color:var(--warn)}.heat .l3{background:var(--ok);color:var(--on-ac);border-color:var(--ok)}
.heat .cur{outline:3px solid var(--ac);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--mut)}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line)}
.chart{width:100%;height:auto}.chart .grid{stroke:var(--line)}.chart text{fill:var(--mut);font:11px var(--body)}.chart .ln{fill:none;stroke:var(--ac);stroke-width:2.5}.chart .pt{fill:var(--ac)}
.dayrow{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--tx)}
.dayrow:last-child{border-bottom:0}
.dayrow .n{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 20px var(--display);border:1px solid var(--line);flex:none}
.dayrow .n.l3{background:var(--ok);color:var(--on-ac);border-color:var(--ok)}.dayrow .n.l1,.dayrow .n.l2{background:var(--acs);color:var(--ac)}
.dayrow.cur .n{outline:3px solid var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav button{flex:1;max-width:170px;background:none;border:0;color:var(--mut);padding:16px 4px;font-weight:600;font-size:16px}
nav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:9}
.msg{color:var(--ac);font-weight:600;min-height:1.2em}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:16px;font-variant-numeric:tabular-nums}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
@media (max-width:420px){h1{font-size:38px}.k{font-size:32px}ol.do{font-size:18px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.learn{background:var(--card);border:2px solid var(--ac);border-radius:16px;padding:18px}
.ex2{font-size:16px}.ex2 b{color:var(--ac)}
.kq{font-weight:600;font-size:18px;border-top:1px solid var(--line);padding-top:10px}
.lbtn{background:var(--acs);color:var(--ac);border:0;border-radius:12px;padding:12px 16px;font-weight:600;font-size:17px;text-align:left;width:100%}
.lbtn .mut{color:var(--ac);opacity:.75}
.opt{border:1px solid var(--line);border-radius:12px;padding:12px}
.timerc{display:flex;flex-direction:column;gap:10px;text-align:center}
.timerc .timer{font-size:52px}
</style>
<div id="app"></div>
<nav id="nav"></nav>
<div id="toast" class="toast" hidden></div>
<script>
const SCHEMA=1, KEY='forja-praxis-v1';
const TOOLS=['Gemba + 5S','PHVA + 7 desperdicios','Restricciones + estándar','Kaizen 1%'];
const WASTES=['Espera','Sobreproducción de ideas','Movimiento sin avance','Retrabajo','Inventario sin aplicar','Planear sin ejecutar','Transporte','Talento sin usar'];

const LEARN={
 unacosa:{t:'La Una Cosa',que:'La tarea que, si la haces, vuelve todo lo demás más fácil o innecesario. No es la más urgente: es la que más mueve tu resultado.',fab:'Una planta con 20 problemas ataca primero el que frena a los otros 19.',vida:'Si defines a qué clientes sirve Praxis, tu marca, tu oferta y tu agenda se ordenan solas.',q:'¿Qué hago hoy que vuelva lo demás más fácil o innecesario?',src:'Keller, Solo una cosa'},
 metas:{t:'Metas al ahora',src:'Keller, Solo una cosa',que:'Bajar una meta grande, nivel por nivel, hasta lo que haces ahora mismo. Cada nivel prepara el siguiente, como fichas de dominó.',fab:'La meta anual de productividad se vuelve la meta del mes, la de la semana y la del turno de hoy.',vida:'Praxis con clientes en 90 días se vuelve una conversación con un empresario esta semana y una lista de 10 contactos hoy.',q:'¿Qué debo hacer hoy para que la meta de la semana sea posible?'},
 gemba:{t:'Gemba',src:'Lean, Toyota',que:'Gemba significa el lugar real: donde pasa el trabajo. En vez de suponer, vas, miras con tus ojos y registras datos.',fab:'El gerente no mira el reporte de paradas: va a la máquina, observa 30 minutos y anota qué la detiene.',vida:'No supones en qué se va tu mañana: la registras cada 10 minutos y miras los datos.',q:'¿Qué está pasando de verdad, no lo que creo que pasa?'},
 s5:{t:'5S',src:'Lean, Toyota',que:'Método para ordenar un espacio en 5 pasos: Clasificar, Ordenar, Limpiar, Estandarizar y Disciplina. Un espacio ordenado muestra los problemas y elimina búsquedas.',fab:'Herramientas con su silueta pintada en la pared: si falta una, se ve al instante.',vida:'Escritorio con solo lo de tu Una Cosa, celular fuera y archivos donde siempre están.',q:'¿Qué sobra, qué falta y qué está fuera de lugar?'},
 seiri:{t:'Seiri: Clasificar',src:'5S',que:'Separar lo necesario de lo innecesario y sacar lo innecesario. Lo dudoso recibe una tarjeta roja con fecha: si no lo usas en 30 días, sale.',fab:'Se retiran de la línea los moldes que no se usan hace un año.',vida:'Sacas de tu escritorio y tu celular todo lo que no usas cada semana.',q:'¿Lo uso cada semana? Si no, ¿por qué está aquí?'},
 seiton:{t:'Seiton: Ordenar',src:'5S',que:'Un lugar para cada cosa y cada cosa en su lugar, nombrado y cerca de donde se usa. La meta: encontrar cualquier cosa en 30 segundos.',fab:'Cada estante lleva etiqueta y cada herramienta vuelve a su silueta.',vida:'Carpeta Praxis con subcarpetas fijas y un sitio fijo para cuaderno, cargador y llaves.',q:'¿Lo encuentro en menos de 30 segundos?'},
 seiso:{t:'Seiso: Limpiar',src:'5S',que:'Limpiar es inspeccionar: al limpiar ves lo que falla. Y buscas la fuente de la suciedad para cortarla.',fab:'Al limpiar una máquina el operario descubre una fuga de aceite antes de que cause una parada.',vida:'Vaciar la bandeja de entrada te muestra qué compromisos dejaste abiertos.',q:'¿De dónde viene el desorden y cómo lo corto en la fuente?'},
 seiketsu:{t:'Seiketsu: Estandarizar',src:'5S',que:'Dejar escrito y visible cómo debe verse el lugar ordenado, para que mantenerlo no dependa de la memoria.',fab:'Foto del puesto ideal pegada al lado del puesto real.',vida:'Foto de tu escritorio ordenado y una rutina de 5 minutos para dejarlo igual cada día.',q:'¿Cualquier persona sabría cómo debe quedar esto?'},
 shitsuke:{t:'Shitsuke: Disciplina',src:'5S',que:'Sostener el estándar todos los días y auditarlo. Sin disciplina, las 4 S anteriores se pierden en dos semanas.',fab:'Auditoría semanal de 5S con puntaje visible para el equipo.',vida:'Cada domingo calificas tu 5S del 1 al 5 con datos.',q:'¿Lo sostuve esta semana? ¿Cómo lo sé?'},
 phva:{t:'PHVA',src:'Deming',que:'Ciclo de mejora: Planear, Hacer, Verificar y Actuar. Planeas un cambio pequeño, lo haces, mides si funcionó y decides si se vuelve estándar.',fab:'Se prueba un cambio en una sola línea, se mide una semana y solo si funciona se aplica a toda la planta.',vida:'Apertura es Planear, el bloque es Hacer, el Cierre es Verificar y la mejora de mañana es Actuar.',q:'¿Qué planeé, qué pasó y qué ajusto?'},
 muda:{t:'Los 8 desperdicios',src:'Lean, Taiichi Ohno',que:'Todo lo que consume tiempo o recursos sin agregar valor: espera, sobreproducción, inventario, movimiento, transporte, retrabajo, sobreprocesamiento y talento sin usar.',fab:'Un operario camina 2 km por turno buscando piezas: es movimiento sin valor.',vida:'Diez ideas abiertas son sobreproducción; libros sin aplicar son inventario; planear sin ejecutar es sobreprocesamiento.',q:'¿Esto agrega valor a mi Una Cosa o solo consume tiempo?'},
 porques:{t:'5 porqués',src:'Lean, Toyota',que:'Preguntar por qué cinco veces seguidas para pasar del síntoma a la causa raíz. Se corrige la causa, no el síntoma.',fab:'La máquina paró. ¿Por qué? Se fundió un fusible. ¿Por qué? Sobrecarga. ¿Por qué? Falta lubricación... hasta llegar a la bomba que no se revisa.',vida:'No termino las cosas. ¿Por qué? Cambio de proyecto. ¿Por qué? Me aburro sin resultados rápidos...',q:'¿Por qué pasó? ¿Y por qué pasó eso?'},
 toc:{t:'Teoría de Restricciones',src:'Goldratt',que:'Todo sistema tiene un eslabón que limita su resultado. Mejorar otra cosa no sirve. Pasos: identificar la restricción, explotarla, subordinar todo a ella, elevarla y repetir.',fab:'Si una máquina produce 100 y las demás 200, la planta produce 100. Se mejora esa máquina primero.',vida:'Si tu restricción es la dispersión, cualquier otra mejora se pierde en el próximo cambio de proyecto.',q:'¿Qué es lo que más limita mi avance hoy?'},
 estandar:{t:'Trabajo estandarizado',src:'Lean, Toyota',que:'La mejor forma conocida hoy de hacer una tarea, escrita. No es rígido: es la base para mejorar. Sin estándar no sabes si mejoraste.',fab:'Hoja de trabajo con secuencia, tiempo y puntos clave en cada puesto.',vida:'Tu mañana escrita hora por hora: si te desvías, lo ves y lo corriges.',q:'¿Cuál es la mejor forma que conozco hoy de hacer esto?'},
 pokayoke:{t:'Poka-yoke',src:'Shigeo Shingo',que:'Diseñar el entorno para que el error sea imposible o se note al instante. No depender de la fuerza de voluntad.',fab:'Una pieza que solo encaja en una posición: no se puede montar al revés.',vida:'El celular en otro cuarto hace imposible revisarlo durante el bloque.',q:'¿Cómo hago que el error sea imposible, no solo improbable?'},
 andon:{t:'Andon',src:'Lean, Toyota',que:'Una señal para detener el trabajo cuando aparece un problema, en vez de seguir y esconderlo. Parar a tiempo es más barato que corregir después.',fab:'El operario tira de una cuerda, se enciende una luz y el líder llega a ayudar.',vida:'Al notar que te desviaste, te detienes, respiras un minuto, lees tu Una Cosa y vuelves.',q:'¿Cuál es mi señal para detenerme y volver?'},
 kaizen:{t:'Kaizen',src:'Lean',que:'Mejora continua en pasos pequeños y medidos, todos los días. Mejorar 1% diario es sostenible; los cambios gigantes casi nunca lo son.',fab:'Cada semana el equipo hace una mejora pequeña en su puesto y la mide.',vida:'Una mejora diaria en tu rutina, medida, durante 28 días.',q:'¿Qué puedo mejorar 1% hoy y cómo lo mido?'},
 experimento:{t:'Experimento personal',src:'Kaizen · PHVA',que:'Probar una mejora como un científico: hipótesis, un solo cambio, una métrica y una fecha. Si cambias varias cosas a la vez, no sabes qué funcionó.',fab:'Se prueba una nueva secuencia solo en el turno de la mañana y se compara con la tarde.',vida:'Si trabajo antes de abrir el celular, mis minutos en la Una Cosa suben. Lo pruebo 3 días.',q:'¿Qué cambio, qué mido y cuándo evalúo?'},
 sientonces:{t:'Plan si-entonces',src:'Gollwitzer',que:'Decidir antes qué harás cuando aparezca un obstáculo: Si pasa X, entonces hago Y. Es de las técnicas con más evidencia para cumplir metas.',fab:'Si la máquina pasa de 80 °C, entonces se detiene y se avisa a mantenimiento.',vida:'Si me dan ganas de abrir redes, entonces escribo la idea en la lista de espera y vuelvo.',q:'¿Qué me va a frenar hoy y qué haré cuando pase?'},
 woop:{t:'WOOP',src:'Oettingen',que:'Deseo, mejor resultado, obstáculo interno y plan. Imaginar solo el éxito puede bajar tu esfuerzo; contrastarlo con el obstáculo lo sube.',fab:'Antes del lanzamiento, el equipo escribe el resultado deseado y lo que dentro del equipo puede fallar.',vida:'Deseo: cumplir la semana. Obstáculo: mi aburrimiento. Plan: si me aburro, cambio de lugar pero no de tarea.',q:'¿Qué en mí puede impedirlo?'},
 premortem:{t:'Pre-mortem',src:'Gary Klein',que:'Imaginar que el proyecto ya fracasó y escribir por qué. Así aparecen riesgos que el optimismo esconde.',fab:'Antes de instalar un software, el equipo escribe las razones por las que la implementación fracasó.',vida:'Es el día 28 y no cumplí. ¿Por qué? Las causas se vuelven planes si-entonces.',q:'Si esto fracasa, ¿cuál será la causa más probable?'},
 pd:{t:'Práctica deliberada',src:'Ericsson',que:'Practicar una subhabilidad específica, al borde de tu capacidad, con retroalimentación inmediata y repetición. No es repetir lo que ya sabes.',fab:'Un técnico practica el cambio de molde cronometrado hasta bajarlo de 40 a 10 minutos.',vida:'Te grabas explicando un concepto, te escuchas, corriges un error y repites.',q:'¿Qué error concreto voy a corregir en este intento?'},
 recuperacion:{t:'Recuperación',src:'Dunlosky 2013',que:'Recordar sin mirar las notas. Es una de las técnicas de estudio mejor evaluadas; releer y subrayar rinden poco.',fab:'Un operario explica el procedimiento de memoria antes de ver la hoja.',vida:'Al cierre escribes 3 aprendizajes sin mirar nada.',q:'¿Qué recuerdo sin mirar?'},
 mapa:{t:'Mapa mental',src:'Buzan',que:'Una idea central en el medio de la hoja, ramas curvas con una palabra cada una y colores. Lo que ayuda es dibujarlo tú mismo.',fab:'Mapa de causas de un problema de calidad dibujado por el equipo en una pizarra.',vida:'Tu día real dibujado: ves de un vistazo dónde se va el tiempo.',q:'¿Qué veo dibujado que no veía en la lista?'},
 rendicion:{t:'Rendición de cuentas',src:'Harkin 2016 · Hill',que:'Reportar tu progreso a otra persona aumenta el efecto de medirlo. Comprometerte en público te hace cumplir más.',fab:'Reunión diaria de 10 minutos donde cada líder reporta sus indicadores.',vida:'Cada domingo envías tus 3 indicadores a tu socio de rendición de cuentas.',q:'¿A quién le rindo cuentas esta semana?'}
};

const P=(c)=>({t:'Aplícalo a Praxis',min:20,learn:null,steps:['Explica '+c+' a un empresario en 3 frases, como si solo tuviera 5 minutos.','Diseña un ejercicio práctico de 15 minutos para enseñarlo en un taller de la Fábrica de Aprendizaje.','Escribe qué resultado medible esperarías en su empresa.'],f:[['p1','Mi explicación en 3 frases','area'],['p2','Mi ejercicio de taller','area'],['p3','Resultado medible esperado','text']]});
const PD={t:'Práctica deliberada',src:'Ericsson · Dunlosky',min:30,learn:'pd',steps:['Elige el concepto de hoy.','Grábate explicándolo en 2 minutos, sin notas.','Escucha la grabación y encuentra 1 error o duda.','Grábate otra vez corrigiéndolo.'],f:[['e1','Concepto que expliqué','text'],['e2','Error o duda que encontré','area'],['e3','Qué mejoró en la segunda versión','area']]};
const METAS=(extra)=>({t:'Metas al ahora',src:'Keller, Solo una cosa',min:30,learn:'metas',steps:['Responde cada nivel con una sola frase.','Ve de lo lejano a lo inmediato: cada respuesta prepara la siguiente.'].concat(extra||[]),f:[['e1','Algún día quiero...','text'],['e2','En 5 años...','text'],['e3','Este año...','text'],['e4','Este mes...','text'],['e5','Esta semana...','text'],['e6','Hoy...','text'],['e7','Ahora mismo...','text']]});
const WOOP=(w,extra)=>({t:'WOOP de la semana '+w,src:'Oettingen',min:30,learn:'woop',steps:['Escribe tu deseo para la semana '+w+'.','Escribe el mejor resultado si lo logras.','Escribe tu obstáculo interno principal: algo en ti, no afuera.','Escribe qué harás cuando aparezca.'].concat(extra?[extra[0]]:[]),f:[['e1','Deseo','text'],['e2','Mejor resultado','text'],['e3','Obstáculo interno','text'],['e4','Si aparece ese obstáculo, entonces...','text']].concat(extra?[extra[1]]:[])});
const PREM=(when,f2)=>({t:'Pre-mortem',src:'Gary Klein',min:30,learn:'premortem',steps:['Imagina que '+when+' y fracasaste.','Escribe 5 causas de ese fracaso.','Convierte cada causa en un plan si-entonces.'],f:[['e1','5 causas del fracaso','area'],['e2',f2||'Mis planes si-entonces','area']]});

const $=s=>document.querySelector(s);
let lOpen=null, ucOpen=0;
let S=load(), view='hoy', cur=1, sess=null, confirmReset=false, msg='', tick=null;
function load(){ try{const r=JSON.parse(localStorage.getItem(KEY)); if(r&&r.schema===SCHEMA) return r;}catch(e){} return {schema:SCHEMA,start:null,days:{},wait:[],targets:{blocks:null,mej:null},proj:{1:1,2:1,3:1,4:1}}; }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
function ymd(d){ const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4); return z.toISOString().slice(0,10); }
function dayNum(){ if(!S.start) return 0; return Math.round((new Date(ymd(new Date())+'T00:00')-new Date(S.start+'T00:00'))/864e5)+1; }
function dd(n){ if(!S.days[n]) S.days[n]={b:[false,false,false]}; if(!S.days[n].b) S.days[n].b=[false,false,false]; return S.days[n]; }
function lvl(n){ const d=S.days[n]; return d&&d.b?d.b.filter(Boolean).length:0; }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(t){ const e=$('#toast'); e.textContent=t; e.hidden=false; clearTimeout(e._t); e._t=setTimeout(()=>e.hidden=true,2200); }
function weekMetrics(w){ let done=0,prom=0,mej=0; const t=dayNum(); for(let n=(w-1)*7+1;n<=w*7;n++){ if(n>t) break; prom+=3; const d=S.days[n]; if(d){done+=lvl(n); mej+=(d.kzDone?1:0)+(d.uncDone?1:0);} } return {done,prom,pct:prom?Math.round(done/prom*100):null,mej,complete:w*7<=t}; }
function weekPass(w){ const m=weekMetrics(w),T=S.targets; if(!m.complete||T.blocks==null||T.mej==null) return null; return m.pct>=T.blocks&&m.mej>=T.mej&&(S.projNow??1)<=1; }
function streak(){ let s=0; const t=Math.min(dayNum(),28); for(let n=t;n>=1;n--){ if(lvl(n)===3) s++; else if(n===t) continue; else break; } return s; }

function render(){
 clearInterval(tick);
 const nav=[['hoy','Hoy'],['plan','Plan'],['prog','Progreso'],['aj','Ajustes']];
 $('#nav').innerHTML=nav.map(([k,l])=>`<button class="${view===k&&!sess?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 $('#nav').hidden=!!sess;
 $('#app').innerHTML = sess ? vSess() : {hoy:vHoy,plan:vPlan,prog:vProg,aj:vAj}[view]();
 if(sess && $('#tm')) { upTimer(); tick=setInterval(upTimer,1000); }
}
function go(v){ view=v; sess=null; msg=''; confirmReset=false; if(v==='hoy') cur=Math.min(Math.max(dayNum(),1),28); render(); scrollTo(0,0); }
function startNow(){ S.start=ymd(new Date()); cur=1; save(); render(); }

function ring(k){ const r=36,c=2*Math.PI*r; return `<svg class="ring" viewBox="0 0 84 84" role="img" aria-label="${k} de 3 sesiones"><circle class="bgc" cx="42" cy="42" r="${r}"/><circle class="fgc" cx="42" cy="42" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-k/3)}" transform="rotate(-90 42 42)"/><text x="42" y="50" text-anchor="middle">${k}/3</text></svg>`; }

function vHoy(){
 const n=cur, d=dd(n), q=QUOTES[(n-1)%QUOTES.length], today=dayNum(), ss=sessions(n);
 const startCard = !S.start ? `<div class="card stack"><h3>Empieza tu Fase 1</h3><div class="mut">28 días. Cada mañana: 3 sesiones guiadas. La app te dice qué hacer, paso a paso.</div><button class="btn" onclick="startNow()">Empezar hoy</button></div>` : '';
 const tiles=ss.map((s,i)=>{const done=d.b[i]; return `<button class="tile ${done?'done':''}" onclick="openS(${i})"><span class="num">${done?'✓':i+1}</span><span class="tx"><h3>${s.name}</h3><span class="mut">${s.time} · ${esc(s.desc)}</span></span><span class="go" aria-hidden="true">›</span></button>`}).join('');
 const wl=S.wait.map((w,i)=>{const left=30-Math.floor((Date.now()-w.t)/864e5);return `<div class="hero"><span>${esc(w.x)}</span><span class="mut">${left>0?left+' días':'lista para evaluar'} <button class="btn2" style="padding:4px 10px" aria-label="Quitar" onclick="delWait(${i})">×</button></span></div>`}).join('');
 return `<div class="stack">
 <div class="hero"><div><div class="eyebrow">Semana ${Math.ceil(n/7)} · ${TOOLS[Math.ceil(n/7)-1]}</div><h1>Día ${n}${n===today?'':''}</h1><div class="mut">${n===today?'Hoy':S.start?'Viendo otro día':'Vista previa'}</div></div>${ring(lvl(n))}</div>
 ${startCard}
 <div class="quote">${esc(q[0])}<div class="mut" style="font-style:normal">${esc(q[1])}</div></div>
 ${tiles}
 <div class="actions" style="justify-content:space-between"><button class="btn2" onclick="step(-1)">‹ Día anterior</button><button class="btn2" onclick="step(1)">Día siguiente ›</button></div>
 <div class="card stack"><h3>¿Idea nueva?</h3><div class="mut">Anótala aquí y vuelve a tu Una Cosa. Se evalúa en 30 días.</div><input type="text" id="wi" placeholder="Escribe la idea" aria-label="Idea nueva"><button class="btn2" onclick="addWait()">Guardar en lista de espera</button>${wl}</div>
 </div>`;
}
function step(k){ cur=Math.min(28,Math.max(1,cur+k)); render(); }
function openS(i){ sess={k:i,s:0}; render(); scrollTo(0,0); }
function addWait(){ const v=$('#wi').value.trim(); if(!v) return; S.wait.push({x:v,t:Date.now()}); save(); toast('Guardada. Vuelve a tu Una Cosa.'); render(); }
function delWait(i){ S.wait.splice(i,1); save(); render(); }

function field(n,[k,l,type]){
 const d=dd(n), id='f-'+k;
 if(type==='suggest') return `<button class="lbtn sug" onclick="useSug(${n})">Usar la propuesta: ${esc(l)}</button>`;
 if(type==='onething') return oneThing(n,k,false);
 if(type==='onething-open') return `<div><div class="fl">${l}</div>${oneThing(n,k,true)}</div>`;
 if(type==='scale') return `<div><div class="fl">${l}</div><div class="scale">${[1,2,3,4,5].map(v=>`<button class="${d[k]===v?'on':''}" aria-label="${l}: ${v}" onclick="setA(${n},'${k}',${v},1)">${v}</button>`).join('')}</div><div class="hero mut" style="font-size:14px;padding:0"><span>Muy bajo</span><span>Muy alto</span></div></div>`;
 if(type==='chips'){ const a=d[k]||[]; return `<div><div class="fl">${l}</div><div class="chips">${WASTES.map((w,i)=>`<button class="${a.includes(w)?'on':''}" onclick="togChip(${n},'${k}',${i})">${w}</button>`).join('')}</div></div>`; }
 if(type==='check'||type==='yes') return `<label class="chk" for="${id}"><input type="checkbox" id="${id}" ${d[k]?'checked':''} onchange="setA(${n},'${k}',this.checked,1)"><span>${l}</span></label>`;
 if(type==='area') return `<div><label class="fl" for="${id}">${l}</label><textarea id="${id}" oninput="setA(${n},'${k}',this.value)">${esc(d[k])}</textarea></div>`;
 return `<div><label class="fl" for="${id}">${l}</label><input type="${type==='num'?'number':'text'}" inputmode="${type==='num'?'numeric':'text'}" id="${id}" value="${esc(d[k])}" oninput="setA(${n},'${k}',${type==='num'?'this.value===\'\'?\'\':+this.value':'this.value'})"></div>`;
}
function useSug(n){ setA(n,'main','Completar el entrenamiento de hoy: '+DAYS[n-1].t,1); toast('Una Cosa definida'); }
function setA(n,k,v,re){ dd(n)[k]=v; save(); if(re) render(); }
function togChip(n,k,i){ const d=dd(n), w=WASTES[i]; d[k]=d[k]||[]; d[k]=d[k].includes(w)?d[k].filter(x=>x!==w):d[k].concat(w); save(); render(); }

function statsBox(n){ const m=weekMetrics(Math.ceil(n/7)); return `<div class="card stats"><div><div class="k">${m.pct==null?'–':m.pct+'%'}</div><div class="mut">Sesiones cumplidas</div></div><div><div class="k">${m.mej}</div><div class="mut">Mejoras y acciones incómodas</div></div><div><div class="k">${streak()}</div><div class="mut">Días seguidos al 100%</div></div></div>`; }

function learnCard(key){ const L=LEARN[key]; if(!L) return ''; return `<div class="learn stack"><div class="eyebrow">${esc(L.src)} · 1 minuto</div><h3>${esc(L.t)}</h3><div>${esc(L.que)}</div><div class="ex2"><b>En una fábrica: </b>${esc(L.fab)}</div><div class="ex2"><b>En tu vida: </b>${esc(L.vida)}</div><div class="kq">${esc(L.q)}</div></div>`; }
function learnBtn(key){ const L=LEARN[key]; if(!L) return ''; const open=lOpen===key; return `<button class="lbtn" aria-expanded="${open}" onclick="lOpen=lOpen==='${key}'?null:'${key}';render()">${open?'Ocultar':'¿Qué es '+esc(L.t)+'?'} <span class="mut">(1 min)</span></button>${open?learnCard(key):''}`; }
function oneThing(n,k,open){
 const d=dd(n), p=k+'_o';
 if(!open && !ucOpen) return `<button class="btn2" onclick="ucOpen=1;render()">Ayúdame a definirla</button>`;
 const rows=[0,1,2,3,4].map(i=>{const v=d[p+i]||'', y=d[p+'y'+i], im=d[p+'i'+i]; return `<div class="opt stack"><input type="text" id="${p}${i}" aria-label="Opción ${i+1}" placeholder="Opción ${i+1}" value="${esc(v)}" oninput="setA(${n},'${p}${i}',this.value)"><div class="mut">¿Si la hago, lo demás se vuelve más fácil o innecesario?</div><div class="scale">${[['Sí',true],['No',false]].map(([l,b])=>`<button class="${y===b?'on':''}" onclick="setA(${n},'${p}y${i}',${b},1)">${l}</button>`).join('')}</div><div class="mut">Impacto en tu vida y en Praxis</div><div class="scale">${[1,2,3,4,5].map(x=>`<button class="${im===x?'on':''}" onclick="setA(${n},'${p}i${i}',${x},1)">${x}</button>`).join('')}</div></div>`}).join('');
 const opts=[0,1,2,3,4].filter(i=>d[p+i]&&d[p+'y'+i]!==undefined&&d[p+'i'+i]).map(i=>({i,t:d[p+i],s:(d[p+'y'+i]?10:0)+d[p+'i'+i]})).sort((a,b)=>b.s-a.s);
 const best=opts[0];
 return `<div class="card stack"><h3>Encuentra tu Una Cosa</h3><div class="mut">Escribe hasta 5 opciones y evalúa cada una. La app ordena y te sugiere la más fuerte.</div>${rows}
 ${best?`<div class="learn stack"><div class="eyebrow">Sugerencia</div><h3>${esc(best.t)}</h3><button class="btn" onclick="setA(${n},'${k}',dd(${n})['${p}${best.i}'],1);toast('Una Cosa definida')">Elegir esta</button></div>`:''}
 ${d[k]&&k!=='main'?`<div class="kq">Elegida: ${esc(d[k])}</div>`:''}</div>`;
}

function vSess(){
 const n=cur, S0=sessions(n)[sess.k], st=S0.steps[sess.s], last=sess.s===S0.steps.length-1;
 return `<div class="stack">
 <div class="hero"><button class="btn2" onclick="sess=null;render()">‹ Hoy</button><span class="mut">Día ${n} · ${S0.name}</span></div>
 <div class="dots" aria-label="Paso ${sess.s+1} de ${S0.steps.length}">${S0.steps.map((_,i)=>`<i class="${i<=sess.s?'on':''}"></i>`).join('')}</div>
 <div class="eyebrow">Paso ${sess.s+1} de ${S0.steps.length}${st.min?' · '+st.min+' min':''}${st.src?' · '+esc(st.src):''}</div>
 <h2>${esc(st.t)}</h2>
 ${st.learnOpen?learnCard(st.learnOpen):''}
 <ol class="do">${st.do.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
 ${st.learn?learnBtn(st.learn):''}
 ${st.min&&!st.learnOpen?timerBox(n,'tm'+sess.k+'_'+sess.s,st.min):''}
 ${st.stats?statsBox(n):''}
 ${(st.f||[]).map(f=>field(n,f)).join('')}
 <div class="why"><b>Por qué: </b>${esc(st.why)}</div>
 <div class="actions">${sess.s>0?`<button class="btn2" onclick="go2(-1)">‹ Atrás</button>`:''}<button class="btn" onclick="${last?'finish()':'go2(1)'}">${last?'Terminar '+S0.name:'Siguiente'}</button></div>
 </div>`;
}
function go2(k){ sess.s+=k; lOpen=null; ucOpen=0; render(); scrollTo(0,0); }
function finish(){ const n=cur, d=dd(n); d.b[sess.k]=true; save(); const name=sessions(n)[sess.k].name; sess=null; render(); scrollTo(0,0); toast(name+' completada'); }

function timerBox(n,key,min){ const ts=dd(n)[key]; return `<div class="card timerc"><div class="timer" id="tm" data-k="${key}" data-m="${min}">${min}:00</div><div class="mut" id="tms">${min} minutos para este ejercicio</div>${ts?`<button class="btn2" onclick="dd(${n})['${key}']=null;save();render()">Reiniciar</button>`:`<button class="btn" onclick="dd(${n})['${key}']=Date.now();save();render()">Iniciar ${min} min</button>`}</div>`; }
function upTimer(){ const e=$('#tm'); if(!e) return; const ts=dd(cur)[e.dataset.k], dur=e.dataset.m*60000; if(!ts) return; const left=Math.max(0,dur-(Date.now()-ts)); const m=Math.floor(left/60000), s=Math.floor(left%60000/1000); e.textContent=m+':'+String(s).padStart(2,'0'); $('#tms').textContent=left?'En curso: sigue los pasos.':'Tiempo cumplido. Completa tus respuestas y sigue.'; }

function vPlan(){
 const t=dayNum();
 return `<div class="stack"><h1>Plan</h1><div class="mut">28 días, una herramienta por semana. Toca un día para abrirlo.</div>`+[0,1,2,3].map(w=>`<div class="card"><div class="eyebrow">Semana ${w+1}</div><h3 style="margin-bottom:6px">${TOOLS[w]}</h3>${[0,1,2,3,4,5,6].map(i=>{const n=w*7+i+1;return `<button class="dayrow ${n===t?'cur':''}" onclick="cur=${n};view='hoy';render();scrollTo(0,0)"><span class="n l${lvl(n)}">${n}</span><span>${esc(DAYS[n-1].t)}</span></button>`}).join('')}</div>`).join('')+`</div>`;
}

function energyChart(){
 const pts=[]; for(let n=1;n<=28;n++){ const v=S.days[n]&&S.days[n].en; if(v) pts.push([n,v]); }
 const X=n=>24+(n-1)*(256/27), Y=v=>100-(v-1)*20;
 const grid=[1,3,5].map(v=>`<line class="grid" x1="24" x2="280" y1="${Y(v)}" y2="${Y(v)}"/><text x="14" y="${Y(v)+4}" text-anchor="middle">${v}</text>`).join('');
 const xl=[1,7,14,21,28].map(n=>`<text x="${X(n)}" y="118" text-anchor="middle">${n}</text>`).join('');
 const line=pts.length>1?`<polyline class="ln" points="${pts.map(([n,v])=>X(n)+','+Y(v)).join(' ')}"/>`:'';
 return `<svg class="chart" viewBox="0 0 290 122" role="img" aria-label="Energía por día">${grid}${xl}${line}${pts.map(([n,v])=>`<circle class="pt" cx="${X(n)}" cy="${Y(v)}" r="3.5"/>`).join('')}</svg>${pts.length?'':'<div class="mut">Aparece cuando registres tu energía en la Apertura.</div>'}`;
}
function vProg(){
 const t=Math.min(dayNum(),28), all=[1,2,3,4].map(weekMetrics);
 const done=all.reduce((a,m)=>a+m.done,0), prom=all.reduce((a,m)=>a+m.prom,0), pct=prom?Math.round(done/prom*100):0, T=S.targets;
 const passes=[2,3,4].map(weekPass);
 const gate = T.blocks==null||T.mej==null ? ['nt','Fija tus metas en Ajustes al terminar la semana 1.'] : passes.includes(false) ? ['','No pasa: repite la Fase 1.'] : passes.every(p=>p===true) ? ['ok','Superada: pasa a Fase 2, Praxis.'] : ['nt','En evaluación.'];
 const rows=[1,2,3,4].map(w=>{const m=all[w-1],p=weekPass(w);return `<tr><td>Semana ${w}</td><td>${m.pct==null?'–':m.pct+'%'}</td><td>${m.prom?m.mej:'–'}</td><td>${p==null?'<span class="pill nt">pendiente</span>':p?'<span class="pill ok">cumple</span>':'<span class="pill">no cumple</span>'}</td></tr>`}).join('');
 return `<div class="stack"><h1>Progreso</h1>
 <div class="card stats"><div><div class="k">${pct}%</div><div class="mut">Sesiones cumplidas</div></div><div><div class="k">${streak()}</div><div class="mut">Días seguidos al 100%</div></div><div><div class="k">${t}/28</div><div class="mut">Días</div></div></div>
 <div class="card stack"><h3>Tus 28 días</h3><div class="heat">${Array.from({length:28},(_,i)=>`<button class="l${lvl(i+1)} ${i+1===dayNum()?'cur':''}" aria-label="Día ${i+1}" onclick="cur=${i+1};view='hoy';render();scrollTo(0,0)">${i+1}</button>`).join('')}</div>
 <div class="legend"><span><i></i>0 sesiones</span><span><i style="background:var(--acs)"></i>1</span><span><i style="background:var(--warn)"></i>2</span><span><i style="background:var(--ok)"></i>3</span></div></div>
 <div class="card stack"><h3>Tu energía</h3>${energyChart()}</div>
 <div class="card stack"><h3>Indicadores por semana</h3><div class="tw"><table><tr><th></th><th>Sesiones</th><th>Mejoras</th><th>Estado</th></tr>${rows}</table></div><div class="mut">Metas: sesiones ${T.blocks==null?'sin fijar':'≥ '+T.blocks+'%'}, mejoras ${T.mej==null?'sin fijar':'≥ '+T.mej+' por semana'}, proyectos activos ≤ 1.</div></div>
 <div class="card stack"><h3>Puerta a Fase 2</h3><div class="pill ${gate[0]}" style="border-radius:12px;padding:10px 14px;font-size:16px">${gate[1]}</div><div class="mut">Regla: semanas 2, 3 y 4 seguidas cumpliendo, con tu antes y después documentado.</div></div>
 <div class="card stack"><h3>Contexto para tu coach</h3><div class="mut">Copia todo tu registro y pégalo en tu Claude Project. Así tu coach conoce tu avance real.</div><button class="btn" onclick="copyCtx()">Copiar mi registro</button><textarea id="ctx" aria-label="Registro en texto" hidden></textarea></div>
 </div>`;
}
function context(){
 const lab={};
 let out=`# Forja Praxis: registro de Salomon\nInicio: ${S.start||'sin iniciar'} · Día actual: ${Math.min(dayNum(),28)} de 28\n`;
 for(let n=1;n<=28;n++){ const d=S.days[n]; if(!d) continue; const ss=sessions(n); const lines=[];
  ss.forEach(s=>s.steps.forEach(st=>(st.f||[]).forEach(([k,l,ty])=>{ if(ty==='suggest'||ty==='onething') return; let v=d[k]; if(v===undefined||v===''||v===false||(Array.isArray(v)&&!v.length)) return; if(v===true) v='sí'; if(Array.isArray(v)) v=v.join(', '); lines.push(`- ${l}: ${v}`); })));
  if(!lines.length&&!lvl(n)) continue;
  out+=`\n## Día ${n} · ${DAYS[n-1].t} · sesiones ${lvl(n)}/3\n`+lines.join('\n')+'\n'; }
 if(S.wait.length) out+=`\n## Lista de espera\n`+S.wait.map(w=>'- '+w.x).join('\n')+'\n';
 return out;
}
function copyCtx(){ const t=$('#ctx'), txt=context(); t.value=txt; navigator.clipboard.writeText(txt).then(()=>toast('Registro copiado'),()=>{t.hidden=false;t.select();toast('Selecciona y copia el texto');}); }

function vAj(){
 const T=S.targets;
 return `<div class="stack"><h1>Ajustes</h1>
 <div class="card stack"><h3>Metas</h3><div class="mut">Fíjalas al terminar la semana 1, con tus datos reales.</div><div><label class="fl" for="tb">Meta de sesiones cumplidas (%)</label><input type="number" id="tb" min="0" max="100" value="${T.blocks??''}" onchange="S.targets.blocks=this.value===''?null:+this.value;save()"></div><div><label class="fl" for="tm2">Meta de mejoras y acciones incómodas por semana</label><input type="number" id="tm2" min="0" value="${T.mej??''}" onchange="S.targets.mej=this.value===''?null:+this.value;save()"></div><div><label class="fl" for="pn">Proyectos activos hoy (meta: 1)</label><input type="number" id="pn" min="0" value="${S.projNow??1}" onchange="S.projNow=+this.value;save()"></div></div>
 <div class="card stack"><h3>Fecha de inicio</h3><div><label class="fl" for="sd">AAAA-MM-DD</label><input type="text" id="sd" value="${S.start||''}" placeholder="2026-11-11"></div><button class="btn2" onclick="setStart()">Guardar fecha</button></div>
 <div class="card stack"><h3>Respaldo</h3><div class="mut">Tus datos viven solo en este navegador. Cada domingo copia el respaldo y guárdalo en tus notas.</div><button class="btn" onclick="copyBk()">Copiar respaldo</button><div><label class="fl" for="bk">Para restaurar, pega aquí tu respaldo</label><textarea id="bk"></textarea></div><button class="btn2" onclick="restore($('#bk').value)">Restaurar</button></div>
 <div class="msg" id="msg">${esc(msg)}</div>
 <div class="card stack"><h3>Reiniciar</h3>${confirmReset?`<div class="mut">Esto borra todo tu registro y no se puede deshacer.</div><div class="actions"><button class="btn" onclick="doReset()">Sí, borrar todo</button><button class="btn2" onclick="confirmReset=false;render()">Cancelar</button></div>`:`<button class="btn2" onclick="confirmReset=true;render()">Borrar todos los datos</button>`}</div></div>`;
}
function say(t){ msg=t; const m=$('#msg'); if(m) m.textContent=t; }
function setStart(){ const v=$('#sd').value.trim(); if(/^\d{4}-\d{2}-\d{2}$/.test(v)){S.start=v;save();toast('Fecha guardada');render();} else say('Escribe la fecha como AAAA-MM-DD.'); }
function copyBk(){ const t=$('#bk'), txt=JSON.stringify(S); t.value=txt; navigator.clipboard.writeText(txt).then(()=>toast('Respaldo copiado'),()=>{t.select();say('Texto seleccionado: cópialo manualmente.');}); }
function restore(txt){ try{const o=JSON.parse(txt); if(o.schema!==SCHEMA||!o.days) throw 0; S=o; save(); toast('Datos restaurados'); render();}catch(e){ say('Ese texto no es un respaldo válido de Forja Praxis.'); } }
function doReset(){ try{localStorage.removeItem(KEY);}catch(e){} S=load(); confirmReset=false; toast('Datos borrados'); render(); }

cur=Math.min(Math.max(dayNum(),1),28);
render();
</script>
